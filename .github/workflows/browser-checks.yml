name: 代鱼浏览器定向检查
run-name: 代鱼浏览器定向检查 ${{ inputs.check_id }}
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 检查目标完整提交SHA
        type: string
        required: true
      check_id:
        description: 本次定向检查标识
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: daiyu-browser-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      SKIP_JDK_VERSION_CHECK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: 核对冻结源码
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf '%s\n' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - uses: ./.github/actions/setup-temurin
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms/android-37.2 build-tools/37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: 浏览器定向契约
        run: |
          set +e
          set -o pipefail
          mkdir -p browser-checks
          { python3 -B -m unittest discover -s tests -p 'test_browser*.py' -v &&
            PYTHONPATH=tests python3 -B -m unittest test_acceptance_tool_receipt -v; } 2>&1 | tee browser-checks/contracts.log
          code=${PIPESTATUS[0]}
          echo "$code" > browser-checks/contracts.exit
          exit "$code"
      - name: 准备既有依赖（不打包）
        run: |
          set +e
          set -o pipefail
          ./gradlew --no-daemon -I scripts/cooperation/checks_only.init.gradle :app:prepareOfflineSpeechRuntime 2>&1 | tee browser-checks/dependencies.log
          code=${PIPESTATUS[0]}
          echo "$code" > browser-checks/dependencies.exit
          exit "$code"
      - name: 浏览器与工具入口单测（不打包）
        run: |
          set +e
          set -o pipefail
          rm -rf app/build/test-results/testDebugUnitTest
          ./gradlew --no-daemon --parallel --build-cache --console=plain \
            -I scripts/cooperation/checks_only.init.gradle \
            -PdaiyuCheckGraph=browser-checks/task-graph.json \
            :app:testDebugUnitTest \
            --tests 'app.daiyu.android.browser.*' \
            --tests 'app.daiyu.android.ControllerBrowserPreparationTest' \
            --tests 'app.daiyu.android.integration.tools.*Browser*' \
            --tests 'com.openminis.app.browser.*' 2>&1 | tee browser-checks/gradle.log
          code=${PIPESTATUS[0]}
          echo "$code" > browser-checks/gradle.exit
          exit "$code"
      - name: 核对来源、用例与零安装包
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          names = {s.attrib['name'] for s in suites}
          required = {'app.daiyu.android.browser.BrowserToolSessionTest',
                      'app.daiyu.android.browser.BrowserDefaultPermissionTest',
                      'app.daiyu.android.integration.tools.RunBrowserToolsTest',
                      'app.daiyu.android.integration.tools.BrowserConfirmedCatalogTest',
                      'app.daiyu.android.integration.tools.RunOrdinaryBrowserPreparationTest'}
          assert required <= names, required - names
          assert suites and all(int(s.attrib['tests']) > 0 for s in suites)
          assert all(int(s.attrib.get(k, 0)) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          graph = json.loads(Path('browser-checks/task-graph.json').read_text())
          assert ':app:testDebugUnitTest' in graph
          assert not [t for t in graph if re.match(r'(?i)^(assemble|sign|install|uninstall|connected|managedDevice)', t.rsplit(':', 1)[-1])
                      or re.match(r'(?i)^(package|bundle).*(apk|debug|release|androidtest)$', t.rsplit(':', 1)[-1])]
          assert not [p for p in Path('app/build/outputs').rglob('*') if p.is_file() and p.suffix.lower() in ('.apk', '.aab', '.apks')]
          record = dict(source_sha=os.environ['EXPECTED_SHA'], workflow_sha=os.environ['GITHUB_SHA'],
                        run_id=os.environ['GITHUB_RUN_ID'], attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                        tests=sum(int(s.attrib['tests']) for s in suites), classes=sorted(names), apk_built=False)
          Path('browser-checks/record.json').write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(record, ensure_ascii=False))
          PY
      - name: 记录各阶段实际退出值
        if: always()
        env:
          CHECK_ID: ${{ inputs.check_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path('browser-checks')
          root.mkdir(exist_ok=True)
          stages = {}
          commands = {'contracts': "python3 -B -m unittest discover -s tests -p 'test_browser*.py' -v && PYTHONPATH=tests python3 -B -m unittest test_acceptance_tool_receipt -v",
                      'dependencies': './gradlew --no-daemon -I scripts/cooperation/checks_only.init.gradle :app:prepareOfflineSpeechRuntime',
                      'gradle': './gradlew --no-daemon --parallel --build-cache --console=plain -I scripts/cooperation/checks_only.init.gradle -PdaiyuCheckGraph=browser-checks/task-graph.json :app:testDebugUnitTest --tests app.daiyu.android.browser.* --tests app.daiyu.android.ControllerBrowserPreparationTest --tests app.daiyu.android.integration.tools.*Browser* --tests com.openminis.app.browser.*'}
          for stage, command in commands.items():
              file = root / (stage + '.exit')
              stages[stage] = dict(command=command, exit_code=int(file.read_text()) if file.exists() else None,
                                   status='executed' if file.exists() else 'not_executed')
          checkout = subprocess.run(['git', 'rev-parse', 'HEAD'], capture_output=True, text=True)
          receipt = dict(check_id=os.environ['CHECK_ID'], expected_sha=os.environ['EXPECTED_SHA'],
                         checkout_sha=checkout.stdout.strip() if checkout.returncode == 0 else None,
                         workflow_sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                         attempt=int(os.environ['GITHUB_RUN_ATTEMPT']), stages=stages)
          (root / 'execution.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: 上传浏览器定向检查证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 浏览器定向检查
          path: |
            browser-checks/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
