name: 代鱼构建
run-name: ${{ inputs.mode == 'smoke' && format('代鱼API26补检 {0}', inputs.check_id) || inputs.mode == 'checks' && format('代鱼检查 {0} {1}', inputs.check_scope, inputs.check_id) || '代鱼构建' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 执行完整构建或仅跨平台检查
        type: choice
        options:
          - build
          - checks
          - smoke
        default: build
        required: true
      check_scope:
        description: 仅检查模式的补检范围
        type: choice
        options: [all, unit, lint]
        default: all
      expected_sha:
        description: 检查目标完整提交SHA（自动补检必填）
        type: string
        default: ''
      check_id:
        description: 调度去重标识（不含凭据）
        type: string
        default: manual
      source_run_id:
        description: API26补检使用的既有开发包run ID（不重新打包）
        type: string
        default: ''
      source_sha:
        description: API26补检开发包的完整源码SHA
        type: string
        default: ''
env:
  SKIP_JDK_VERSION_CHECK: "true"
  PYTHONUTF8: "1"
permissions:
  contents: read
  actions: read
concurrency:
  group: daiyu-${{ inputs.mode }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    name: 只检查 ${{ matrix.os }}
    if: inputs.mode == 'checks'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '27'
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: 安装检查 SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms/android-37.2 build-tools/37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: 独立边界与脚本检查
        shell: bash
        run: |
          python -B -m unittest discover -s tests -q
          python scripts/verify_boundaries.py
          bash -n scripts/smoke_boot.sh
      - name: 定向检查（不打包）
        shell: bash
        env:
          CHECK_SCOPE: ${{ inputs.check_scope }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python scripts/cooperation/cloud_checks.py --scope "$CHECK_SCOPE"
      - name: 上传检查报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼检查报告-${{ matrix.os }}
          path: |
            cooperation-reports/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
  build:
    name: 单测、检查与开发包
    if: inputs.mode == 'build' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '27'
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: 安装固定 SDK
        run: sdkmanager 'platforms/android-37.2' 'build-tools/37.0.0'
      - name: 校验独立边界
        run: |
          python3 -B -m unittest discover -s tests -q
          python3 scripts/verify_boundaries.py
      - name: 单测与 Lint
        run: ./gradlew --no-daemon :core-domain:test :app:testDebugUnitTest :app:lintDebug
      - name: 准备固定签名
        env:
          DAIYU_RELEASE_KEYSTORE_BASE64: ${{ secrets.DAIYU_RELEASE_KEYSTORE_BASE64 }}
          DAIYU_RELEASE_KEY_ALIAS: ${{ secrets.DAIYU_RELEASE_KEY_ALIAS }}
          DAIYU_RELEASE_KEY_PASSWORD: ${{ secrets.DAIYU_RELEASE_KEY_PASSWORD }}
          DAIYU_RELEASE_STORE_PASSWORD: ${{ secrets.DAIYU_RELEASE_STORE_PASSWORD }}
        run: python3 scripts/prepare_signing.py
      - name: 构建开发 APK
        env:
          DAIYU_REQUIRE_SIGNING: 'true'
          DAIYU_RELEASE_STORE_FILE: ${{ runner.temp }}/daiyu-release.p12
          DAIYU_RELEASE_KEY_ALIAS: ${{ secrets.DAIYU_RELEASE_KEY_ALIAS }}
          DAIYU_RELEASE_KEY_PASSWORD: ${{ secrets.DAIYU_RELEASE_KEY_PASSWORD }}
          DAIYU_RELEASE_STORE_PASSWORD: ${{ secrets.DAIYU_RELEASE_STORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: 清理临时签名文件
        if: always()
        run: rm -f -- "$RUNNER_TEMP/daiyu-release.p12"
      - name: 打包版本与摘要
        shell: bash
        run: |
          mkdir delivery
          short=${GITHUB_SHA:0:8}
          mkdir -p delivery/tests
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk delivery/tests/platform-test.apk
          cp app/build/outputs/apk/debug/app-debug.apk "delivery/代鱼-0.1.0-${short}.apk"
          python3 scripts/verify_signing.py --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner" --delivery delivery
          (cd delivery && sha256sum *.apk tests/*.apk > SHA256SUMS)
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼测试报告
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            core-domain/build/test-results
            core-domain/build/reports/tests
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: 上传开发包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼开发包
          path: delivery/
          if-no-files-found: error
  smoke:
    name: 启动验证 API ${{ matrix.api }}
    needs: build
    if: always() && github.ref == 'refs/heads/main' && ((inputs.mode == 'build' && needs.build.result == 'success') || inputs.mode == 'smoke')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.mode == 'smoke' && '[{"api":"26","target":"google_apis","ram":4096}]' || '[{"api":"26","target":"google_apis","ram":4096},{"api":"37.2","target":"google_apis_ps16k","ram":6144}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: 代鱼开发包
          path: delivery
          run-id: ${{ inputs.mode == 'smoke' && inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: 核对补检开发包与源码身份
        if: inputs.mode == 'smoke'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/verify_smoke_source.py
      - name: 校验 APK 摘要
        run: cd delivery && sha256sum -c SHA256SUMS
      - name: 启用模拟器加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: 统一模拟器命令行工具
        run: |
          tools="$ANDROID_HOME/cmdline-tools"
          test -x "$tools/16111833/bin/avdmanager"
          rm -rf "$tools/latest"
          ln -s "$tools/16111833" "$tools/latest"
          mkdir -p smoke
          free -m | tee smoke/host-memory.txt
          cat "$tools/latest/source.properties" | tee smoke/commandline-tools.txt
          "$tools/latest/bin/sdkmanager" --version
      - name: 预启动 ADB
        run: adb start-server
      - name: 安装并检查启动
        timeout-minutes: 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          EMULATOR_RAM_MB: ${{ matrix.ram }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          disk-size: 8192M
          ram-size: ${{ matrix.ram }}M
          cores: 4
          emulator-options: -memory ${{ matrix.ram }} -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics -show-kernel
          emulator-boot-timeout: 60
          pre-emulator-launch-script: |
            bash scripts/install_bounded_adb.sh
            cp "$ANDROID_AVD_HOME/test.ini" smoke/avd.ini
            cp "$ANDROID_AVD_HOME/test.avd/config.ini" smoke/avd-config.ini
            cat smoke/avd.ini
            grep -Fx 'target=android-${{ matrix.api }}' smoke/avd.ini
          disable-animations: true
          script: bash scripts/smoke_boot.sh
      - name: 上传启动证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼启动证据-API${{ matrix.api }}
          path: smoke/
          if-no-files-found: ignore
