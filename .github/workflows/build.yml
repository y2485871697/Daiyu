name: 代鱼构建
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daiyu-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: 单测、检查与开发包
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '27'
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: 安装固定 SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - name: 校验独立边界
        run: python3 scripts/verify_boundaries.py
      - name: 单测与 Lint
        run: ./gradlew --no-daemon :core-domain:test :app:lintDebug
      - name: 构建开发 APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: 打包版本与摘要
        shell: bash
        run: |
          mkdir delivery
          short=${GITHUB_SHA:0:8}
          cp app/build/outputs/apk/debug/app-debug.apk "delivery/代鱼-0.1.0-${short}.apk"
          printf '{"source_sha":"%s","version_name":"0.1.0","version_code":1,"application_id":"io.github.y2485871697.daiyu","signing":"ephemeral-debug","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > delivery/构建记录.json
          (cd delivery && sha256sum *.apk > SHA256SUMS)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs delivery/*.apk > delivery/签名证据.txt
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼测试报告
          path: |
            core-domain/build/test-results
            core-domain/build/reports/tests
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: 上传开发包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼开发包
          path: delivery/
          if-no-files-found: error
  smoke:
    name: 启动验证 API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: "26"
            target: google_apis
          - api: "37.2"
            target: google_apis_ps16k
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: 代鱼开发包
          path: delivery
      - name: 校验 APK 摘要
        run: cd delivery && sha256sum -c SHA256SUMS
      - name: 启用模拟器加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 安装并检查启动
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/smoke_boot.sh
      - name: 上传启动证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼启动证据-API${{ matrix.api }}
          path: smoke/
          if-no-files-found: ignore
