name: 代鱼构建
run-name: ${{ inputs.mode == 'candidate' && format('代鱼定向候选 {0}-filtered', inputs.check_id) || inputs.mode == 'smoke' && format('代鱼双API补检 {0}{1}', inputs.check_id, inputs.smoke_classes != '' && '-filtered' || '') || inputs.mode == 'checks' && format('代鱼检查 {0} {1}', inputs.check_scope, inputs.check_id) || inputs.mode == 'performance' && format('代鱼性能包 {0}', inputs.check_id) || inputs.mode == 'release' && format('代鱼正式候选 {0}', inputs.check_id) || format('代鱼构建 {0}', inputs.check_id) }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 执行完整构建或仅跨平台检查
        type: choice
        options:
          - build
          - candidate
          - checks
          - smoke
          - synthetic
          - performance
          - release
        default: build
        required: true
      smoke_api:
        description: smoke/candidate目标API（正式构建始终双API）
        type: choice
        options: [all, '26', '37.2']
        default: all
      smoke_classes:
        description: smoke/candidate完整测试类名（candidate必填；定向不计正式验收）
        type: string
        default: ''
      check_scope:
        description: 仅检查模式的补检范围
        type: choice
        options: [all, unit, lint]
        default: all
      expected_sha:
        description: 构建或检查目标完整提交SHA（自动调度必填，手动可留空）
        type: string
        default: ''
      check_id:
        description: 调度去重标识（不含凭据）
        type: string
        default: manual
      source_run_id:
        description: 双API补检使用的既有应用包run ID（不重新打包）
        type: string
        default: ''
      source_sha:
        description: 双API补检应用包的完整源码SHA
        type: string
        default: ''
      source_variant:
        description: 仅smoke补检使用的源包变体（不重新打包）
        type: choice
        options: [debug, release, candidate]
        default: debug
env:
  SKIP_JDK_VERSION_CHECK: "true"
  PYTHONUTF8: "1"
  SMOKE_MODE: ${{ inputs.mode }}
  SMOKE_TEST_CLASSES: ${{ inputs.smoke_classes }}
permissions:
  contents: read
  actions: read
concurrency:
  group: daiyu-${{ inputs.mode }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    name: 只检查 ${{ matrix.os }}
    if: inputs.mode == 'checks'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    steps:
      - name: 限定定向过滤仅用于smoke补检
        shell: bash
        run: test -z "$SMOKE_TEST_CLASSES" || test "$SMOKE_MODE" = smoke
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: |
            21
            27
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: 安装检查 SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms/android-37.2 build-tools/37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: 独立边界与脚本检查
        shell: bash
        run: |
          python scripts/acceptance/record_tool_tests.py --python python
          python scripts/verify_boundaries.py
          bash -n scripts/smoke_boot.sh
      - name: 准备固定离线语音 JNI（不打包）
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./gradlew.bat --no-daemon :app:prepareOfflineSpeechRuntime
          else
            ./gradlew --no-daemon :app:prepareOfflineSpeechRuntime
          fi
      - name: 定向检查（不打包）
        shell: bash
        env:
          CHECK_SCOPE: ${{ inputs.check_scope }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python scripts/cooperation/cloud_checks.py --scope "$CHECK_SCOPE"
      - name: 上传检查报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼检查报告-${{ matrix.os }}
          path: |
            tool-evidence/
            cooperation-reports/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
  build:
    name: 单测、检查与开发包
    if: inputs.mode == 'build' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: 限定定向过滤仅用于smoke补检
        shell: bash
        run: test -z "$SMOKE_TEST_CLASSES" || test "$SMOKE_MODE" = smoke
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 核对完整构建源码身份
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 scripts/cooperation/cloud_checks.py --verify-revision-only
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: |
            21
            27
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: 安装固定 SDK
        run: sdkmanager 'platforms/android-37.2' 'build-tools/37.0.0'
      - name: 校验独立边界
        run: |
          python3 scripts/acceptance/record_tool_tests.py --python python3
          python3 scripts/verify_boundaries.py
      - name: 准备固定离线语音 JNI（不打包）
        run: ./gradlew --no-daemon :app:prepareOfflineSpeechRuntime
      - name: 单测与 Lint
        run: ./gradlew --no-daemon :core-domain:test :app:testDebugUnitTest :app:lintDebug
      - name: 准备固定签名
        env:
          DAIYU_RELEASE_KEYSTORE_BASE64: ${{ secrets.DAIYU_RELEASE_KEYSTORE_BASE64 }}
          DAIYU_RELEASE_KEY_ALIAS: ${{ secrets.DAIYU_RELEASE_KEY_ALIAS }}
          DAIYU_RELEASE_KEY_PASSWORD: ${{ secrets.DAIYU_RELEASE_KEY_PASSWORD }}
          DAIYU_RELEASE_STORE_PASSWORD: ${{ secrets.DAIYU_RELEASE_STORE_PASSWORD }}
        run: python3 scripts/prepare_signing.py
      - name: 构建开发 APK
        env:
          DAIYU_REQUIRE_SIGNING: 'true'
          DAIYU_RELEASE_STORE_FILE: ${{ runner.temp }}/daiyu-release.p12
          DAIYU_RELEASE_KEY_ALIAS: ${{ secrets.DAIYU_RELEASE_KEY_ALIAS }}
          DAIYU_RELEASE_KEY_PASSWORD: ${{ secrets.DAIYU_RELEASE_KEY_PASSWORD }}
          DAIYU_RELEASE_STORE_PASSWORD: ${{ secrets.DAIYU_RELEASE_STORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: 清理临时签名文件
        if: always()
        run: rm -f -- "$RUNNER_TEMP/daiyu-release.p12"
      - name: 打包版本与摘要
        shell: bash
        run: |
          mkdir delivery
          short=${GITHUB_SHA:0:8}
          mkdir -p delivery/tests
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk delivery/tests/platform-test.apk
          cp app/build/outputs/apk/debug/app-debug.apk "delivery/代鱼-0.1.0-${short}.apk"
          python3 scripts/verify_signing.py --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner" --delivery delivery
          python3 scripts/verify_license_bundle.py --apk "delivery/代鱼-0.1.0-${short}.apk"
          (cd delivery && sha256sum *.apk tests/*.apk > SHA256SUMS)
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼测试报告
          path: |
            tool-evidence/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            core-domain/build/test-results
            core-domain/build/reports/tests
            app/build/reports/lint-results-debug.*
            app/build/reports/host-pty/
          if-no-files-found: ignore
      - name: 上传开发包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼开发包
          path: delivery/
          if-no-files-found: error
  release:
    name: 单测、检查与生产Release
    if: inputs.mode == 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: 限定定向过滤仅用于smoke补检
        shell: bash
        run: test -z "$SMOKE_TEST_CLASSES" || test "$SMOKE_MODE" = smoke
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 核对完整构建源码身份
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 scripts/cooperation/cloud_checks.py --verify-revision-only
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: |
            21
            27
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: 安装固定 SDK
        run: sdkmanager 'platforms/android-37.2' 'build-tools/37.0.0'
      - name: 校验独立边界
        run: |
          python3 scripts/acceptance/record_tool_tests.py --python python3
          python3 scripts/verify_boundaries.py
      - name: 准备固定离线语音 JNI（不打包）
        run: ./gradlew --no-daemon :app:prepareOfflineSpeechRuntime
      - name: 准备固定签名
        env:
          DAIYU_RELEASE_KEYSTORE_BASE64: ${{ secrets.DAIYU_RELEASE_KEYSTORE_BASE64 }}
          DAIYU_RELEASE_KEY_ALIAS: ${{ secrets.DAIYU_RELEASE_KEY_ALIAS }}
          DAIYU_RELEASE_KEY_PASSWORD: ${{ secrets.DAIYU_RELEASE_KEY_PASSWORD }}
          DAIYU_RELEASE_STORE_PASSWORD: ${{ secrets.DAIYU_RELEASE_STORE_PASSWORD }}
        run: python3 scripts/prepare_signing.py
      - name: 单测与 Lint
        env:
          DAIYU_REQUIRE_SIGNING: 'true'
          DAIYU_RELEASE_STORE_FILE: ${{ runner.temp }}/daiyu-release.p12
          DAIYU_RELEASE_KEY_ALIAS: ${{ secrets.DAIYU_RELEASE_KEY_ALIAS }}
          DAIYU_RELEASE_KEY_PASSWORD: ${{ secrets.DAIYU_RELEASE_KEY_PASSWORD }}
          DAIYU_RELEASE_STORE_PASSWORD: ${{ secrets.DAIYU_RELEASE_STORE_PASSWORD }}
        run: ./gradlew --no-daemon -PdaiyuProductionRelease=true :core-domain:test :app:testReleaseUnitTest :app:lintRelease
      - name: 构建生产 Release 与同变体测试 APK
        env:
          DAIYU_REQUIRE_SIGNING: 'true'
          DAIYU_RELEASE_STORE_FILE: ${{ runner.temp }}/daiyu-release.p12
          DAIYU_RELEASE_KEY_ALIAS: ${{ secrets.DAIYU_RELEASE_KEY_ALIAS }}
          DAIYU_RELEASE_KEY_PASSWORD: ${{ secrets.DAIYU_RELEASE_KEY_PASSWORD }}
          DAIYU_RELEASE_STORE_PASSWORD: ${{ secrets.DAIYU_RELEASE_STORE_PASSWORD }}
        run: ./gradlew --no-daemon -PdaiyuProductionRelease=true :app:assembleRelease :app:assembleReleaseAndroidTest
      - name: 清理临时签名文件
        if: always()
        run: rm -f -- "$RUNNER_TEMP/daiyu-release.p12"
      - name: 打包版本与摘要
        shell: bash
        run: |
          mkdir delivery
          short=${GITHUB_SHA:0:8}
          mkdir -p delivery/tests
          cp app/build/outputs/apk/androidTest/release/app-release-androidTest.apk delivery/tests/platform-test.apk
          cp app/build/outputs/apk/release/app-release.apk "delivery/代鱼-0.1.0-${short}.apk"
          python3 scripts/verify_release_package.py --apkanalyzer "$ANDROID_HOME/cmdline-tools/16111833/bin/apkanalyzer" --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner" --delivery delivery
          python3 scripts/verify_license_bundle.py --apk "delivery/代鱼-0.1.0-${short}.apk"
          (cd delivery && sha256sum *.apk tests/*.apk > SHA256SUMS)
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼Release测试报告
          path: |
            tool-evidence/
            app/build/test-results/testReleaseUnitTest/
            app/build/reports/tests/testReleaseUnitTest/
            core-domain/build/test-results
            core-domain/build/reports/tests
            app/build/reports/lint-results-release.*
            app/build/reports/host-pty/
          if-no-files-found: ignore
      - name: 上传生产Release候选包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼正式候选包
          path: delivery/
          if-no-files-found: error
  synthetic:
    name: ${{ inputs.mode == 'performance' && '隔离 Release 性能包' || '隔离合成测试包' }}
    if: (inputs.mode == 'synthetic' || inputs.mode == 'performance') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: 限定定向过滤仅用于smoke补检
        shell: bash
        run: test -z "$SMOKE_TEST_CLASSES" || test "$SMOKE_MODE" = smoke
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 核对完整构建源码身份
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 scripts/cooperation/cloud_checks.py --verify-revision-only
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: |
            21
            27
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: 安装固定 SDK
        run: sdkmanager 'platforms/android-37.2' 'build-tools/37.0.0'
      - name: 校验独立边界
        run: |
          python3 scripts/acceptance/record_tool_tests.py --python python3
          python3 scripts/verify_boundaries.py
      - name: 准备固定离线语音 JNI（不打包）
        run: ./gradlew --no-daemon :app:prepareOfflineSpeechRuntime
      - name: 准备固定签名
        env:
          DAIYU_RELEASE_KEYSTORE_BASE64: ${{ secrets.DAIYU_RELEASE_KEYSTORE_BASE64 }}
          DAIYU_RELEASE_KEY_ALIAS: ${{ secrets.DAIYU_RELEASE_KEY_ALIAS }}
          DAIYU_RELEASE_KEY_PASSWORD: ${{ secrets.DAIYU_RELEASE_KEY_PASSWORD }}
          DAIYU_RELEASE_STORE_PASSWORD: ${{ secrets.DAIYU_RELEASE_STORE_PASSWORD }}
        run: python3 scripts/prepare_signing.py
      - name: 构建隔离 APK（性能模式仅 Release）
        shell: bash
        env:
          PHYSICAL_PERFORMANCE: ${{ inputs.mode == 'performance' }}
          DAIYU_REQUIRE_SIGNING: 'true'
          DAIYU_RELEASE_STORE_FILE: ${{ runner.temp }}/daiyu-release.p12
          DAIYU_RELEASE_KEY_ALIAS: ${{ secrets.DAIYU_RELEASE_KEY_ALIAS }}
          DAIYU_RELEASE_KEY_PASSWORD: ${{ secrets.DAIYU_RELEASE_KEY_PASSWORD }}
          DAIYU_RELEASE_STORE_PASSWORD: ${{ secrets.DAIYU_RELEASE_STORE_PASSWORD }}
        run: |
          if [[ "$PHYSICAL_PERFORMANCE" == "true" ]]; then
            ./gradlew --no-daemon -PdaiyuSyntheticApplication=true -PdaiyuPhysicalPerformance=true :app:assembleRelease :app:assembleReleaseAndroidTest
          else
            ./gradlew --no-daemon -PdaiyuSyntheticApplication=true :app:assembleDebug :app:assembleDebugAndroidTest
          fi
      - name: 清理临时签名文件
        if: always()
        run: rm -f -- "$RUNNER_TEMP/daiyu-release.p12"
      - name: 核对独立包身份、变体与签名
        shell: bash
        env:
          PHYSICAL_PERFORMANCE: ${{ inputs.mode == 'performance' }}
        run: |
          if [[ "$PHYSICAL_PERFORMANCE" == "true" ]]; then
            directory=performance-delivery
            build_type=release
            variant=release-synthetic
          else
            directory=synthetic-delivery
            build_type=debug
            variant=debug-synthetic
          fi
          mkdir -p "$directory/tests"
          cp "app/build/outputs/apk/$build_type/app-$build_type.apk" "$directory/app-synthetic.apk"
          cp "app/build/outputs/apk/androidTest/$build_type/app-$build_type-androidTest.apk" "$directory/tests/platform-test.apk"
          python3 scripts/verify_synthetic_package.py --directory "$directory" --variant "$variant" --apkanalyzer "$ANDROID_HOME/cmdline-tools/16111833/bin/apkanalyzer" --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          python3 scripts/verify_license_bundle.py --apk "$directory/app-synthetic.apk"
      - name: 上传隔离合成测试包
        if: inputs.mode == 'synthetic'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼合成测试包
          path: synthetic-delivery/
          if-no-files-found: error
      - name: 上传隔离 Release 性能包
        if: inputs.mode == 'performance'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼Release性能测试包
          path: performance-delivery/
          if-no-files-found: error
  candidate:
    name: 定向候选编译（非正式交付）
    if: inputs.mode == 'candidate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: 限定候选模式及必填测试类
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_VARIANT: ${{ inputs.source_variant }}
        run: |
          test "$SMOKE_MODE" = candidate
          test -n "$SMOKE_TEST_CLASSES"
          test -z "$SOURCE_RUN_ID"
          test -z "$SOURCE_SHA"
          test "$SOURCE_VARIANT" = debug
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 核对完整构建源码身份
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 scripts/cooperation/cloud_checks.py --verify-revision-only
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: |
            21
            27
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: 安装固定 SDK
        run: sdkmanager 'platforms/android-37.2' 'build-tools/37.0.0'
      - name: 准备固定离线语音 JNI（不打包）
        run: ./gradlew --no-daemon :app:prepareOfflineSpeechRuntime
      - name: 定向受影响单测
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'app.daiyu.android.VoiceHostGateTest' --tests 'app.daiyu.android.model.RuntimeModelOverridesTest' --tests 'app.daiyu.android.model.ProviderSnapshotContractTest' --tests 'app.daiyu.android.model.catalog.CatalogModelParametersTest' --tests 'app.daiyu.android.model.catalog.LocalCatalogChatModelPickerSessionTest' --tests 'app.daiyu.android.terminal.LinuxSettingsControllerTest' --tests 'app.daiyu.android.terminal.install.LinuxProductionCompositionTest' --tests 'app.daiyu.android.context.CatalogSummaryBindingsTest' --tests 'app.daiyu.android.context.CatalogSummaryExecutionPolicyTest' --tests 'app.daiyu.android.context.CompressionSettingsEditorTest' --tests 'app.daiyu.android.ui.screens.settings.CompressionSettingsDraftTest' --tests 'app.daiyu.android.ui.screens.chat.conversation.ComposerReferencesTest' --tests 'app.daiyu.android.ui.actions.ComposerTextActionTest' --tests 'app.daiyu.android.balance.ProviderBalanceRuntimeHostTest' --tests 'app.daiyu.android.balance.BalanceProductionOwnershipTest' --tests 'app.daiyu.android.context.ProviderSummaryModelTest' --tests 'app.daiyu.android.context.ContextManagementControllerAdapterTest' --tests 'app.daiyu.android.model.ImageModelInputTest' --tests 'app.daiyu.android.model.ProviderUsageTest' --tests 'app.daiyu.android.backup.RunCheckpointCodecTest' --tests 'app.daiyu.android.backup.BackupPackageSpoolTest' --tests 'app.daiyu.android.data.repository.RecordedUsageProjectionTest' --tests 'app.daiyu.android.ui.model.ConversationTokenUsageUiTest' --tests 'app.daiyu.android.storage.CompressionCheckpointCodecTest' --tests 'app.daiyu.android.model.RequestInputEstimateTest' --tests 'app.daiyu.android.model.ProviderFailureBoundaryTest' --tests 'app.daiyu.android.model.auxiliary.AuxiliaryVisionModelAdapterTest' --tests 'app.daiyu.android.pet.AndroidPetModelPortTest' --tests 'app.daiyu.android.ControllerVideoSendingTest' --tests 'app.daiyu.android.ui.screens.chat.conversation.ChatTurnMapperTest' --tests 'app.daiyu.android.ui.screens.settings.ProviderBalanceConfigurationTest' --tests 'app.daiyu.android.ui.screens.chat.conversation.ToolRichDetailsTest' --tests 'app.daiyu.android.delegation.SavedSubAgentRuntimeBindingsTest' --tests 'app.daiyu.android.ui.components.subagent.SubAgentThinkingPreferenceTest' --tests 'app.daiyu.android.ui.screens.chat.conversation.MarkdownProjectionTest' --tests 'app.daiyu.android.ui.screens.terminal.TerminalTaskOutputTest'
      - name: 运行时压缩领域单测
        run: ./gradlew --no-daemon :core-domain:test --tests 'app.daiyu.android.domain.runtime.RunnerContextRuntimeTest'
      - name: 准备固定签名
        env:
          DAIYU_RELEASE_KEYSTORE_BASE64: ${{ secrets.DAIYU_RELEASE_KEYSTORE_BASE64 }}
          DAIYU_RELEASE_KEY_ALIAS: ${{ secrets.DAIYU_RELEASE_KEY_ALIAS }}
          DAIYU_RELEASE_KEY_PASSWORD: ${{ secrets.DAIYU_RELEASE_KEY_PASSWORD }}
          DAIYU_RELEASE_STORE_PASSWORD: ${{ secrets.DAIYU_RELEASE_STORE_PASSWORD }}
        run: python3 scripts/prepare_signing.py
      - name: 构建开发 APK
        env:
          DAIYU_REQUIRE_SIGNING: 'true'
          DAIYU_RELEASE_STORE_FILE: ${{ runner.temp }}/daiyu-release.p12
          DAIYU_RELEASE_KEY_ALIAS: ${{ secrets.DAIYU_RELEASE_KEY_ALIAS }}
          DAIYU_RELEASE_KEY_PASSWORD: ${{ secrets.DAIYU_RELEASE_KEY_PASSWORD }}
          DAIYU_RELEASE_STORE_PASSWORD: ${{ secrets.DAIYU_RELEASE_STORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: 清理临时签名文件
        if: always()
        run: rm -f -- "$RUNNER_TEMP/daiyu-release.p12"
      - name: 打包隔离定向候选（不可正式交付）
        shell: bash
        run: |
          mkdir -p candidate-delivery/tests
          cp app/build/outputs/apk/debug/app-debug.apk "candidate-delivery/candidate-${GITHUB_SHA:0:8}.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk candidate-delivery/tests/platform-test.apk
          python3 scripts/candidate_package.py create --directory candidate-delivery --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner"
      - name: 上传隔离定向候选
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼定向候选包-filtered
          path: candidate-delivery/
          if-no-files-found: error
  smoke:
    name: ${{ inputs.mode == 'candidate' && '定向候选验证' || '启动验证' }} API ${{ matrix.api }} 分片${{ matrix.shard }}${{ inputs.smoke_classes != '' && '-filtered' || '' }}
    needs: [build, release, candidate]
    if: always() && github.ref == 'refs/heads/main' && ((inputs.mode == 'build' && needs.build.result == 'success') || (inputs.mode == 'release' && needs.release.result == 'success') || (inputs.mode == 'candidate' && needs.candidate.result == 'success') || inputs.mode == 'smoke')
    runs-on: ubuntu-26.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.mode == 'smoke' || inputs.mode == 'candidate') && inputs.smoke_api == '26' && '[{"api":"26","target":"google_apis","ram":4096,"shard":0},{"api":"26","target":"google_apis","ram":4096,"shard":1},{"api":"26","target":"google_apis","ram":4096,"shard":2},{"api":"26","target":"google_apis","ram":4096,"shard":3}]' || (inputs.mode == 'smoke' || inputs.mode == 'candidate') && inputs.smoke_api == '37.2' && '[{"api":"37.2","target":"google_apis_ps16k","ram":6144,"shard":0},{"api":"37.2","target":"google_apis_ps16k","ram":6144,"shard":1},{"api":"37.2","target":"google_apis_ps16k","ram":6144,"shard":2},{"api":"37.2","target":"google_apis_ps16k","ram":6144,"shard":3}]' || '[{"api":"26","target":"google_apis","ram":4096,"shard":0},{"api":"26","target":"google_apis","ram":4096,"shard":1},{"api":"26","target":"google_apis","ram":4096,"shard":2},{"api":"26","target":"google_apis","ram":4096,"shard":3},{"api":"37.2","target":"google_apis_ps16k","ram":6144,"shard":0},{"api":"37.2","target":"google_apis_ps16k","ram":6144,"shard":1},{"api":"37.2","target":"google_apis_ps16k","ram":6144,"shard":2},{"api":"37.2","target":"google_apis_ps16k","ram":6144,"shard":3}]') }}
    steps:
      - name: 限定定向过滤仅用于smoke或candidate
        shell: bash
        run: |
          if test "$SMOKE_MODE" = candidate; then
            test -n "$SMOKE_TEST_CLASSES"
          else
            test -z "$SMOKE_TEST_CLASSES" || test "$SMOKE_MODE" = smoke
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 核对启动验证源码身份
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 scripts/cooperation/cloud_checks.py --verify-revision-only
      - name: 补检当前 CHECK 工具原文
        if: inputs.mode == 'smoke'
        run: python3 scripts/acceptance/record_tool_tests.py --python python3
      - name: 上传补检工具证据
        if: always() && inputs.mode == 'smoke'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼工具证据-smoke-API${{ matrix.api }}-分片${{ matrix.shard }}${{ inputs.smoke_classes != '' && '-filtered' || '' }}
          path: tool-evidence/
          if-no-files-found: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ (inputs.mode == 'candidate' || (inputs.mode == 'smoke' && inputs.source_variant == 'candidate')) && '代鱼定向候选包-filtered' || (inputs.mode == 'release' || (inputs.mode == 'smoke' && inputs.source_variant == 'release')) && '代鱼正式候选包' || '代鱼开发包' }}
          path: delivery
          run-id: ${{ inputs.mode == 'smoke' && inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: 核对补检应用包与源码身份
        if: inputs.mode == 'smoke'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_VARIANT: ${{ inputs.source_variant }}
        run: python3 scripts/verify_smoke_source.py
      - name: 核对同run定向候选身份
        if: inputs.mode == 'candidate'
        run: python3 scripts/candidate_package.py verify --directory delivery
      - name: 校验 APK 摘要
        run: cd delivery && sha256sum -c SHA256SUMS
      - name: 启用模拟器加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: 统一模拟器命令行工具
        run: |
          tools="$ANDROID_HOME/cmdline-tools"
          test -x "$tools/16111833/bin/avdmanager"
          rm -rf "$tools/latest"
          ln -s "$tools/16111833" "$tools/latest"
          mkdir -p smoke
          rm -f smoke/prelaunch-ready.txt
          free -m | tee smoke/host-memory.txt
          cat "$tools/latest/source.properties" | tee smoke/commandline-tools.txt
          "$tools/latest/bin/sdkmanager" --version
      - name: 安装模拟器宿主依赖
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0
      - name: 预启动 ADB
        run: adb start-server
      - name: 安装并检查启动
        timeout-minutes: 160
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          EMULATOR_RAM_MB: ${{ matrix.ram }}
          SMOKE_SHARD_COUNT: '4'
          SMOKE_SHARD_INDEX: ${{ matrix.shard }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          disk-size: 8192M
          ram-size: ${{ matrix.ram }}M
          cores: 4
          emulator-build: ${{ matrix.api == '26' && '13610412' || '' }}
          emulator-options: -memory ${{ matrix.ram }} -no-window -gpu ${{ matrix.api == '26' && 'swiftshader_indirect' || 'swiftshader' }} -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics -show-kernel
          emulator-boot-timeout: 180
          pre-emulator-launch-script: bash scripts/prepare_smoke_emulator.sh "${{ matrix.api }}"
          disable-animations: true
          script: bash -c 'set +e; test -s smoke/prelaunch-ready.txt && bash scripts/smoke_boot.sh; code=$?; printf "%s\n" "$code" > smoke/exit-code.txt; exit "$code"'
      - name: 上传启动证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.mode == 'candidate' && '代鱼定向候选证据' || '代鱼启动证据' }}-API${{ matrix.api }}-分片${{ matrix.shard }}${{ inputs.smoke_classes != '' && '-filtered' || '' }}
          path: smoke/
          if-no-files-found: ignore
