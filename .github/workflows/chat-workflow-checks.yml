name: 代鱼工作流程检查
run-name: 代鱼工作流程检查 ${{ inputs.check_id }}
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 检查目标完整提交SHA
        type: string
        required: true
      check_id:
        description: 本次定向检查标识
        type: string
        required: true
      check_scope:
        description: 工作流程、环境圆点、发送状态、表格样式、冷启动、任务滚动、附件弹层或权限界面的定向检查范围
        type: choice
        options: [workflow, environment-dots, composer-send, markdown-table, cold-start, task-scroll, attachment-contracts, permission-contracts]
        default: workflow
permissions:
  contents: read
concurrency:
  group: daiyu-chat-workflow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  workflow:
    if: github.ref == 'refs/heads/main' && inputs.check_scope != 'attachment-contracts' && inputs.check_scope != 'permission-contracts'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      SKIP_JDK_VERSION_CHECK: 'true'
      WORKFLOW_CHECK_SCOPE: ${{ inputs.check_scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: 核对检查源码
        run: |
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: |
            21
            27
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms/android-37.2 build-tools/37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: 工作流程定向契约
        shell: bash
        run: |
          mkdir -p workflow-checks
          set -o pipefail
          python3 -B - 2>&1 <<'PY' | tee workflow-checks/contracts.log
          import json, os, unittest
          from pathlib import Path
          records = []
          patterns = ('test_tool_card_html_contract.py',) if os.environ['WORKFLOW_CHECK_SCOPE'] == 'environment-dots' else (
              'test_reasoning_workflow_contract.py', 'test_work_timeline_connector_contract.py',
              'test_workflow_render_isolation_contract.py', 'test_reasoning_stream_cost_contract.py',
              'test_tool_card_html_contract.py', 'test_markdown_typing_contract.py',
              'test_markdown_body_visibility_contract.py', 'test_workflow_narration_contract.py',
              'test_chat_resume_scroll_contract.py', 'test_reasoning_typewriter_contract.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'composer-send':
              patterns = ('test_composer_surface_color_contract.py', 'test_chat_submission_preview_contract.py',
                          'test_compression_send_gate_contract.py', 'test_delegation_batch_and_send_contract.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'markdown-table':
              patterns = ('test_markdown_table_style_contract.py', 'test_markdown_entry_contract.py',
                          'test_markdown_body_visibility_contract.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'cold-start':
              patterns = ('test_chat_initial_position_contract.py', 'test_chat_resume_scroll_contract.py',
                          'test_markdown_cold_start_contract.py', 'test_markdown_return_contract.py',
                          'test_markdown_body_visibility_contract.py', 'test_markdown_typing_contract.py',
                          'test_large_history_storage_contract.py', 'test_markdown_entry_contract.py',
                          'test_streaming_follow_contract.py', 'test_chat_menu_scroll_isolation_contract.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'task-scroll':
              patterns = ('test_reasoning_stream_cost_contract.py', 'test_workflow_render_isolation_contract.py',
                          'test_markdown_typing_contract.py', 'test_chat_resume_scroll_contract.py',
                          'test_task_scroll_smoke_scope.py', 'test_diagnostic_smoke_source.py')
          for pattern in patterns:
              suite = unittest.TestLoader().discover('tests', pattern=pattern)
              assert suite.countTestCases() > 0, pattern
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              assert result.wasSuccessful() and not result.skipped, pattern
              records.append(dict(pattern=pattern, tests=result.testsRun, skipped=0))
          Path('workflow-checks/contracts.json').write_text(json.dumps(records, indent=2) + '\n')
          PY
          python3 scripts/verify_boundaries.py
      - name: 准备既有离线语音依赖（不打包）
        run: ./gradlew --no-daemon -I scripts/cooperation/checks_only.init.gradle :app:prepareOfflineSpeechRuntime
      - name: 工作流程定向单测及Compose源码编译（不打包）
        shell: bash
        run: |
          set -o pipefail
          classes=(AssistantWorkflowContentTest ToolHeaderTextTest)
          if [[ "$WORKFLOW_CHECK_SCOPE" != environment-dots ]]; then
            classes+=(ChatTurnMapperTest ReasoningWorkflowMapperTest AssistantWorkflowCompositionTest
                      WorkflowConnectorsTest ReasoningHandoffTest MarkdownAdmissionCompositionTest
                      WorkflowNarrationCompositionTest MarkdownRevealTest MarkdownRevealHapticsTest)
          fi
          filters=()
          if [[ "$WORKFLOW_CHECK_SCOPE" == composer-send ]]; then
            classes=(ComposerPhaseProjectionTest ForegroundComposerStateTest ChatSubmissionPreviewTest ChatProjectionTest)
            filters+=(--tests app.daiyu.android.ui.actions.ComposerTextActionTest)
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == markdown-table ]]; then
            classes=(MarkdownTableGridTest)
            filters+=(--tests app.daiyu.android.MarkdownTableWidthTest)
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == cold-start ]]; then
            classes=(RestoredMarkdownTest MarkdownProjectionCacheTest MarkdownProjectionTest
                     MarkdownPreparationCompositionTest MarkdownRevealTest ChatTurnMapperTest ChatInitialPositionPolicyTest)
            filters+=(--tests app.daiyu.android.context.ContextTimelineColdStartTest)
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == task-scroll ]]; then
            classes=(MarkdownRevealTest MarkdownRevealInvalidationTest MarkdownRevealHapticsTest
                     AssistantWorkflowCompositionTest WorkflowNarrationCompositionTest ReasoningStreamCompositionTest)
          fi
          for class in "${classes[@]}"; do
            filters+=(--tests "app.daiyu.android.ui.screens.chat.conversation.$class")
          done
          ./gradlew --no-daemon --parallel --build-cache --console=plain \
            -I scripts/cooperation/checks_only.init.gradle \
            -PdaiyuCheckGraph=workflow-checks/task-graph.json \
            :app:compileDebugKotlin :app:testDebugUnitTest "${filters[@]}" \
            :app:compileDebugAndroidTestKotlin 2>&1 | tee workflow-checks/gradle.log
      - name: 核对定向报告及零安装包
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path.cwd()
          expected = {'AssistantWorkflowContentTest', 'ToolHeaderTextTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] != 'environment-dots':
              expected |= {'ChatTurnMapperTest', 'ReasoningWorkflowMapperTest', 'AssistantWorkflowCompositionTest',
                           'WorkflowConnectorsTest', 'ReasoningHandoffTest', 'MarkdownAdmissionCompositionTest',
                           'WorkflowNarrationCompositionTest', 'MarkdownRevealTest', 'MarkdownRevealHapticsTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'composer-send':
              expected = {'ComposerPhaseProjectionTest', 'ForegroundComposerStateTest', 'ChatSubmissionPreviewTest',
                          'ChatProjectionTest', 'ComposerTextActionTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'markdown-table':
              expected = {'MarkdownTableGridTest', 'MarkdownTableWidthTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'cold-start':
              expected = {'RestoredMarkdownTest', 'MarkdownProjectionCacheTest', 'MarkdownProjectionTest',
                          'MarkdownPreparationCompositionTest', 'MarkdownRevealTest', 'ChatTurnMapperTest',
                          'ChatInitialPositionPolicyTest', 'ContextTimelineColdStartTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'task-scroll':
              expected = {'MarkdownRevealTest', 'MarkdownRevealInvalidationTest', 'MarkdownRevealHapticsTest',
                          'AssistantWorkflowCompositionTest', 'WorkflowNarrationCompositionTest', 'ReasoningStreamCompositionTest'}
          suites = [ET.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          names = {suite.attrib['name'].rsplit('.', 1)[-1] for suite in suites}
          assert names == expected, (names, expected)
          assert all(int(s.attrib['tests']) > 0 for s in suites)
          assert all(int(s.attrib.get(k, 0)) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          graph = json.loads(Path('workflow-checks/task-graph.json').read_text())
          log = Path('workflow-checks/gradle.log').read_text()
          outcomes = {}
          for task in (':app:compileDebugKotlin', ':app:testDebugUnitTest', ':app:compileDebugAndroidTestKotlin'):
              assert task in graph, task
              match = re.search(r'^> Task ' + re.escape(task) + r'(?: (UP-TO-DATE|FROM-CACHE|NO-SOURCE|SKIPPED))?\s*$', log, re.M)
              assert match and match.group(1) not in ('NO-SOURCE', 'SKIPPED'), task
              outcomes[task] = match.group(1) or 'EXECUTED'
          packages = [str(p) for p in root.rglob('*') if p.is_file() and p.suffix.lower() in ('.apk', '.aab', '.apks')]
          assert not packages, packages
          record = dict(source_sha=os.environ['EXPECTED_SHA'], workflow_sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                        attempt=int(os.environ['GITHUB_RUN_ATTEMPT']), tests=sum(int(s.attrib['tests']) for s in suites),
                        check_scope=os.environ['WORKFLOW_CHECK_SCOPE'], classes=sorted(names), contracts=json.loads(Path('workflow-checks/contracts.json').read_text()),
                        task_outcomes=outcomes, apk_built=False, instrumentation_run=False)
          Path('workflow-checks/record.json').write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(record, ensure_ascii=False))
          PY
      - name: 上传检查证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 工作流程定向检查
          path: |
            workflow-checks/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/host-pty/
          if-no-files-found: error

  attachment-contracts:
    name: 界面精简定向契约
    if: github.ref == 'refs/heads/main' && (inputs.check_scope == 'attachment-contracts' || inputs.check_scope == 'permission-contracts')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CONTRACT_SCOPE: ${{ inputs.check_scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: 界面精简定向契约（不编译、不打包）
        shell: bash
        run: |
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p attachment-checks
          set -o pipefail
          python3 -B - 2>&1 <<'PY' | tee attachment-checks/contracts.log
          import json, os, unittest
          from pathlib import Path
          records = []
          patterns = ('test_permission_check_contract.py', 'test_accessibility_keepalive_contract.py') if os.environ['CONTRACT_SCOPE'] == 'permission-contracts' else (
              'test_chat_attachment_sizing_contract.py', 'test_shared_sheet_spacing_contract.py',
              'test_sheet_selection_exit_contract.py')
          for pattern in patterns:
              suite = unittest.TestLoader().discover('tests', pattern=pattern)
              assert suite.countTestCases() > 0, pattern
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              assert result.wasSuccessful() and not result.skipped, pattern
              records.append(dict(pattern=pattern, tests=result.testsRun, skipped=0))
          record = dict(source_sha=os.environ['EXPECTED_SHA'], workflow_sha=os.environ['GITHUB_SHA'],
                        run_id=os.environ['GITHUB_RUN_ID'], attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                        check_scope=os.environ['CONTRACT_SCOPE'], contracts=records,
                        apk_built=False, instrumentation_run=False, kotlin_compiled=False)
          Path('attachment-checks/record.json').write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(record, ensure_ascii=False))
          PY
      - name: 上传附件契约证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.check_scope == 'permission-contracts' && '权限界面契约检查' || '附件弹层契约检查' }}
          path: attachment-checks/
          if-no-files-found: error
