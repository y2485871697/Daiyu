name: 代鱼工作流程检查
run-name: 代鱼工作流程检查 ${{ inputs.check_id }}
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 检查目标完整提交SHA
        type: string
        required: true
      contract_tools_sha:
        description: task-scroll或message-actions可选；固定修正后的契约工具提交，不改变被检源码或重新打包
        type: string
        default: ''
      check_id:
        description: 本次定向检查标识
        type: string
        required: true
      check_scope:
        description: 工作流程、环境圆点、发送状态、表格样式、冷启动、任务滚动、附件弹层、权限界面、终端输出或工具回执的定向检查范围
        type: choice
        options: [workflow-node-motion, workflow-collapse, workflow, environment-dots, composer-send, markdown-table, cold-start, session-switch, task-scroll, attachment-contracts, permission-contracts, terminal-output, tool-receipts, page-performance, rendering, legacy-restore, search-history, conversation-date, ime, message-actions, question-card]
        default: workflow
permissions:
  contents: read
concurrency:
  group: daiyu-chat-workflow-${{ github.ref }}-${{ inputs.check_scope }}
  cancel-in-progress: false
jobs:
  workflow:
    if: github.ref == 'refs/heads/main' && inputs.check_scope != 'attachment-contracts' && inputs.check_scope != 'permission-contracts'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      SKIP_JDK_VERSION_CHECK: 'true'
      WORKFLOW_CHECK_SCOPE: ${{ inputs.check_scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: 核对检查源码
        run: |
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: 核对独立契约工具参数
        if: inputs.contract_tools_sha != ''
        env:
          CONTRACT_TOOLS_SHA: ${{ inputs.contract_tools_sha }}
        run: |
          test "$WORKFLOW_CHECK_SCOPE" = task-scroll || test "$WORKFLOW_CHECK_SCOPE" = message-actions
          [[ "$CONTRACT_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: 固定独立契约工具
        if: inputs.contract_tools_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.contract_tools_sha }}
          path: .contract-tools-source
          persist-credentials: false
      - name: 仅更新定向测量契约工具并记录来源
        if: inputs.contract_tools_sha != ''
        env:
          CONTRACT_TOOLS_SHA: ${{ inputs.contract_tools_sha }}
        run: |
          test "$(git -C .contract-tools-source rev-parse HEAD)" = "$CONTRACT_TOOLS_SHA"
          python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          scope = os.environ['WORKFLOW_CHECK_SCOPE']
          names = {
              'task-scroll': ('tests/test_streaming_occlusion_contract.py',),
              'message-actions': ('tests/test_pane_question_smoke_scope.py', 'tests/test_message_confirmation_contract.py'),
          }[scope]
          files = []
          for name in names:
              target = Path(name)
              tool = Path('.contract-tools-source') / name
              before, after = target.read_bytes(), tool.read_bytes()
              files.append(dict(file=name, source_sha256=hashlib.sha256(before).hexdigest(),
                                tools_sha256=hashlib.sha256(after).hexdigest()))
              target.write_bytes(after)
          receipt = dict(source_sha=os.environ['EXPECTED_SHA'], tools_sha=os.environ['CONTRACT_TOOLS_SHA'])
          if scope == 'task-scroll':
              receipt.update(files[0])
          else:
              receipt['files'] = files
          Path('workflow-checks').mkdir(exist_ok=True)
          Path('workflow-checks/contract-tools.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: |
            21
            27
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms/android-37.2 build-tools/37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: 工作流程定向契约
        shell: bash
        run: |
          mkdir -p workflow-checks
          set -o pipefail
          python3 -B - 2>&1 <<'PY' | tee workflow-checks/contracts.log
          import json, os, unittest
          from pathlib import Path
          records = []
          patterns = ('test_tool_card_html_contract.py',) if os.environ['WORKFLOW_CHECK_SCOPE'] in ('environment-dots', 'terminal-output') else (
              'test_reasoning_workflow_contract.py', 'test_work_timeline_connector_contract.py',
              'test_workflow_render_isolation_contract.py', 'test_reasoning_stream_cost_contract.py',
              'test_tool_card_html_contract.py', 'test_markdown_typing_contract.py',
              'test_markdown_body_visibility_contract.py', 'test_workflow_narration_contract.py',
              'test_chat_resume_scroll_contract.py', 'test_reasoning_typewriter_contract.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'workflow':
              patterns += ('test_markdown_cold_start_contract.py', 'test_message_timestamp_style_contract.py', 'test_workflow_body_scope.py', 'test_test_refresh_contract.py', 'test_reasoning_flow_stability_contract.py', 'test_workflow_disclosure_scope.py', 'test_workflow_disclosure_coverage_contract.py', 'test_disclosure_consistency_contract.py', 'test_streaming_occlusion_contract.py', 'test_streaming_follow_contract.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'composer-send':
              patterns = ('test_composer_surface_color_contract.py', 'test_chat_submission_preview_contract.py',
                          'test_compression_send_gate_contract.py', 'test_delegation_batch_and_send_contract.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'markdown-table':
              patterns = ('test_markdown_table_style_contract.py', 'test_markdown_entry_contract.py',
                          'test_markdown_body_visibility_contract.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] in ('cold-start', 'session-switch'):
              patterns = ('test_chat_initial_position_contract.py', 'test_page_back_gesture_contract.py', 'test_chat_resume_scroll_contract.py',
                          'test_markdown_cold_start_contract.py', 'test_markdown_return_contract.py',
                          'test_markdown_body_visibility_contract.py', 'test_markdown_typing_contract.py',
                          'test_markdown_stream_progress_contract.py', 'test_markdown_code_block_contract.py',
                          'test_workflow_render_isolation_contract.py',
                          'test_large_history_storage_contract.py', 'test_markdown_entry_contract.py',
                          'test_message_display_contract.py', 'test_context_usage_wiring_contract.py',
                          'test_tool_receipt_snapshot_contract.py', 'test_tool_receipt_pause_contract.py',
                          'test_pause_receipt_smoke_scope.py',
                          'test_checkpoint_encoding_hotpath_contract.py',
                          'test_streaming_follow_contract.py', 'test_chat_menu_scroll_isolation_contract.py',
                          'test_sidebar_selection_contract.py', 'test_streaming_freeze_contract.py',
                          'test_markdown_entry_smoke_scope.py', 'test_record_tool_tests_scope.py',
                          'test_acceptance_tool_receipt.py', 'test_speech_platform_discovery.py',
                          'test_page_back_smoke_scope.py', 'test_task_scroll_smoke_scope.py',
                          'test_screen_history_smoke_scope.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'session-switch':
              patterns = tuple(pattern for pattern in patterns if pattern != 'test_context_usage_wiring_contract.py')
              patterns += ('test_page_back_repeat_contract.py', 'test_session_switch_check_scope.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'task-scroll':
              patterns = ('test_reasoning_stream_cost_contract.py', 'test_workflow_render_isolation_contract.py',
                          'test_markdown_typing_contract.py', 'test_chat_resume_scroll_contract.py',
                          'test_streaming_occlusion_contract.py',
                          'test_streaming_follow_contract.py', 'test_task_scroll_smoke_scope.py',
                          'test_diagnostic_smoke_source.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'page-performance':
              patterns = ('test_reasoning_stream_cost_contract.py', 'test_workflow_render_isolation_contract.py',
                          'test_markdown_typing_contract.py', 'test_chat_resume_scroll_contract.py',
                          'test_streaming_occlusion_contract.py', 'test_streaming_follow_contract.py',
                          'test_task_scroll_smoke_scope.py', 'test_diagnostic_smoke_source.py',
                          'test_model_bulk_selection_contract.py', 'test_settings_copy_cleanup_contract.py',
                          'test_page_enter_contract.py', 'test_sidebar_selection_contract.py',
                          'test_streaming_freeze_contract.py', 'test_page_performance_contract.py',
                          'test_page_performance_smoke_scope.py', 'test_task_configuration_admission_contract.py',
                          'test_selection_stays_open_contract.py', 'test_workflow_narration_contract.py',
                          'test_disclosure_consistency_contract.py', 'test_preparation_disclosure_alpha_contract.py',
                          'test_reasoning_flow_stability_contract.py', 'test_tool_card_html_contract.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'tool-receipts':
              patterns = ('test_tool_receipt_pause_contract.py', 'test_tool_receipt_snapshot_contract.py',
                          'test_reasoning_workflow_contract.py', 'test_tool_card_html_contract.py',
                          'test_streaming_freeze_contract.py', 'test_reasoning_flow_stability_contract.py', 'test_pause_receipt_smoke_scope.py',
                          'test_record_tool_tests_scope.py', 'test_acceptance_tool_receipt.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'rendering':
              patterns = ('test_reasoning_workflow_contract.py', 'test_reasoning_typewriter_contract.py', 'test_work_timeline_connector_contract.py', 'test_workflow_render_isolation_contract.py', 'test_markdown_typing_contract.py', 'test_markdown_body_visibility_contract.py', 'test_markdown_table_style_contract.py', 'test_markdown_code_block_contract.py', 'test_markdown_entry_contract.py', 'test_markdown_cold_start_contract.py', 'test_markdown_return_contract.py', 'test_markdown_stream_progress_contract.py', 'test_markdown_stream_optimization_contract.py', 'test_message_display_contract.py', 'test_rendering_smoke_scope.py', 'test_record_tool_tests_scope.py', 'test_acceptance_tool_receipt.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'legacy-restore':
              patterns = ('test_message_display_contract.py',)
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'search-history':
              patterns = ('test_search_history_sheet_contract.py', 'test_search_host_start_contract.py', 'test_record_tool_tests_scope.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'conversation-date':
              patterns = ('test_conversation_date_contract.py', 'test_conversation_date_smoke_scope.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'ime':
              patterns = ('test_chat_return_refresh_contract.py', 'test_managed_input_contract.py', 'test_chat_ime_hotpath_contract.py', 'test_chat_ime_lifecycle_contract.py',
                          'test_chat_ime_motion_contract.py', 'test_ime_frame_contract.py',
                          'test_chat_resume_scroll_contract.py', 'test_page_back_gesture_contract.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'message-actions':
              patterns = ('test_chat_submission_preview_contract.py', 'test_pane_question_smoke_scope.py', 'test_message_generation_actions_contract.py', 'test_message_action_snapshot_admission_contract.py',
                          'test_message_action_scroll_contract.py', 'test_message_confirmation_contract.py',
                          'test_branch_configuration_inheritance_contract.py', 'test_message_timestamp_style_contract.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'question-card':
              patterns = ('test_question_card_readability_contract.py', 'test_stream_question_projection_contract.py', 'test_question_card_smoke_scope.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'workflow-collapse':
              patterns = ('test_workflow_disclosure_scope.py', 'test_workflow_disclosure_coverage_contract.py',
                          'test_disclosure_consistency_contract.py', 'test_reasoning_flow_stability_contract.py',
                          'test_tool_card_html_contract.py')
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'workflow-node-motion':
              patterns = ('test_reasoning_workflow_contract.py', 'test_work_timeline_connector_contract.py',
                          'test_workflow_render_isolation_contract.py', 'test_workflow_narration_contract.py',
                          'test_record_tool_tests_scope.py', 'test_reasoning_typewriter_contract.py',
                          'test_markdown_typing_contract.py', 'test_reported_reasoning_markdown_contract.py')
          for pattern in patterns:
              suite = unittest.TestLoader().discover('tests', pattern=pattern)
              discovered = suite.countTestCases()
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              records.append(dict(pattern=pattern, tests=result.testsRun, skipped=len(result.skipped),
                                  discovered=discovered, successful=result.wasSuccessful()))
          Path('workflow-checks/contracts.json').write_text(json.dumps(records, indent=2) + '\n')
          failed_patterns = [record['pattern'] for record in records
                             if not (record['discovered'] > 0 and record['successful'] and record['skipped'] == 0)]
          assert not failed_patterns, failed_patterns
          PY
          python3 scripts/verify_boundaries.py
      - name: 准备既有离线语音依赖（不打包）
        run: ./gradlew --no-daemon -I scripts/cooperation/checks_only.init.gradle :app:prepareOfflineSpeechRuntime
      - name: 工作流程定向单测及Compose源码编译（不打包）
        shell: bash
        run: |
          set -o pipefail
          classes=(AssistantWorkflowContentTest ToolHeaderTextTest ReportedReasoningTextTest)
          if [[ "$WORKFLOW_CHECK_SCOPE" == workflow ]]; then
            classes+=(ReconnectPartsTest WorkflowDisclosureMotionTest ReasoningStreamCompositionTest)
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" != environment-dots ]]; then
            classes+=(ChatTurnMapperTest ReasoningWorkflowMapperTest AssistantWorkflowCompositionTest
                      WorkflowConnectorsTest ReasoningHandoffTest MarkdownAdmissionCompositionTest
                      WorkflowNarrationCompositionTest MarkdownRevealTest MarkdownRevealHapticsTest)
          fi
          filters=()
          if [[ "$WORKFLOW_CHECK_SCOPE" == composer-send ]]; then
            classes=(ComposerPhaseProjectionTest ForegroundComposerStateTest ChatSubmissionPreviewTest ChatProjectionTest)
            filters+=(--tests app.daiyu.android.ui.actions.ComposerTextActionTest)
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == markdown-table ]]; then
            classes=(MarkdownTableGridTest)
            filters+=(--tests app.daiyu.android.MarkdownTableWidthTest)
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == cold-start || "$WORKFLOW_CHECK_SCOPE" == session-switch ]]; then
            classes=(RestoredMarkdownTest ToolPresentationCacheTest ToolPresentationJsonTest ToolCardPresentationTest ToolRichDetailsTest ToolBodyLayoutTest TerminalToolTargetTest MarkdownProjectionCacheTest MarkdownProjectionTest
                     MarkdownPreparationCompositionTest MarkdownRevealTest ChatTurnMapperTest ChatInitialPositionPolicyTest
                     AssistantWorkflowCompositionTest)
            filters+=(--tests app.daiyu.android.context.ContextTimelineColdStartTest
                      --tests app.daiyu.android.storage.SQLiteTextTest
                      --tests app.daiyu.android.storage.SQLiteTextChunksTest
                      --tests app.daiyu.android.ui.ConversationPreviewTest
                      --tests app.daiyu.android.storage.MessageDisplayStoreTest
                      --tests app.daiyu.android.ui.screens.chat.conversation.StreamingHistoryRefreshTest
                      --tests app.daiyu.android.ui.ToolReceiptSourceTest
                      --tests app.daiyu.android.ui.screens.chat.conversation.ToolActivityUiTest)
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == task-scroll ]]; then
            classes=(MarkdownRevealTest MarkdownRevealInvalidationTest MarkdownRevealHapticsTest
                     AssistantWorkflowCompositionTest WorkflowNarrationCompositionTest ReasoningStreamCompositionTest
                     MarkdownAdmissionCompositionTest)
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == page-performance ]]; then
            classes=(MarkdownRevealTest MarkdownRevealInvalidationTest MarkdownRevealHapticsTest
                     AssistantWorkflowCompositionTest WorkflowNarrationCompositionTest ReasoningStreamCompositionTest
                     ToolPresentationCacheTest ChatTurnMapperTest StreamingHistoryRefreshTest)
            filters+=(--tests app.daiyu.android.model.catalog.CatalogModelSelectionTest
                      --tests app.daiyu.android.data.repository.ModelUsageProjectionTest
                      --tests app.daiyu.android.ui.screens.terminal.TerminalTaskOutputTest
                      --tests app.daiyu.android.terminal.TerminalGridBufferTest)
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == terminal-output ]]; then
            classes=(ToolOutputPreviewTest)
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == tool-receipts ]]; then
            classes=(ToolActivityUiTest ChatTurnMapperTest ReasoningWorkflowMapperTest WorkProcessProgressTest)
            filters+=(--tests app.daiyu.android.ui.ToolReceiptSourceTest)
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == rendering ]]; then
            classes=(AssistantWorkflowContentTest ChatTurnMapperTest ReasoningWorkflowMapperTest AssistantWorkflowCompositionTest MarkdownAdmissionCompositionTest WorkflowNarrationCompositionTest ReasoningStreamCompositionTest CompletedReasoningProjectionTest ReportedReasoningTextTest MarkdownBlockReuseTest MarkdownCodePolicyTest MarkdownProjectionTest MarkdownProjectionCacheTest MarkdownPreparationCompositionTest MarkdownRevealTest MarkdownRevealInvalidationTest MarkdownRevealHapticsTest MarkdownTableGridTest RestoredMarkdownTest RenderingMediaGeometryTest MessageMediaLayoutTest ReconnectPartsTest ReconnectMarkdownProjectionAcceptanceTest ReconnectMarkdownRestoreAcceptanceTest LegacyReconnectRestoreTest)
            filters=(--tests app.daiyu.android.MarkdownParserTest --tests app.daiyu.android.StreamingMarkdownParserTest --tests app.daiyu.android.MarkdownTableWidthTest --tests app.daiyu.android.RenderingParserRegressionTest --tests app.daiyu.android.model.ResponsesWebSearchTest --tests app.daiyu.android.model.NativeCompletionWebSearchTest --tests app.daiyu.android.model.LegacySearchDisplayTest --tests app.daiyu.android.model.ResponsesBackgroundResumeTest --tests app.daiyu.android.model.ResponsesDeltaBatchTest --tests app.daiyu.android.storage.MessageDisplayStoreTest)
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == legacy-restore ]]; then
            classes=(LegacyReconnectRestoreTest)
            filters=()
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == search-history ]]; then
            classes=(MessageImageContractTest)
            filters=(--tests app.daiyu.android.ui.screens.search.MessageSearchRequestStateTest
                     --tests app.daiyu.android.ui.screens.search.SearchRequestStateTest
                     --tests app.daiyu.android.ui.screens.search.ConversationSearchResultsTest
                     --tests app.daiyu.android.ui.screens.search.SearchHighlightTest)
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == conversation-date ]]; then
            classes=()
            filters=(--tests app.daiyu.android.ui.components.ConversationDrawerGroupsTest
                     --tests app.daiyu.android.ui.ConversationPreviewTest
                     --tests app.daiyu.android.backup.BackupConversationMergeTest
                     --tests app.daiyu.android.storage.MessageDisplayStoreTest)
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == ime ]]; then
            classes=(ChatInitialPositionPolicyTest)
            filters=()
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == message-actions ]]; then
            classes=()
            filters=(--tests app.daiyu.android.MessageActionRenderedRevisionTest
                     --tests app.daiyu.android.question.QuestionCheckpointEvidenceTest
                     --tests app.daiyu.android.ui.screens.chat.conversation.ChatTurnMapperTest
                     --tests app.daiyu.android.ui.screens.chat.conversation.AssistantWorkflowContentTest)
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == question-card ]]; then
            classes=()
            filters=(--tests app.daiyu.android.question.QuestionCheckpointEvidenceTest
                     --tests app.daiyu.android.integration.tools.QuestionToolBridgeTest)
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == workflow-collapse ]]; then
            classes=(WorkflowDisclosureMotionTest)
            filters=()
          fi
          if [[ "$WORKFLOW_CHECK_SCOPE" == workflow-node-motion ]]; then
            classes=(WorkflowConnectorsTest WorkflowNarrationCompositionTest MarkdownRevealTest ReasoningHandoffTest)
            filters=()
          fi
          for class in "${classes[@]}"; do
            filters+=(--tests "app.daiyu.android.ui.screens.chat.conversation.$class")
          done
          robolectric_init=()
          domain_tasks=()
          if [[ "$WORKFLOW_CHECK_SCOPE" == task-scroll ]]; then
            cat > "$RUNNER_TEMP/daiyu-robolectric-mirror.init.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
              gradle.rootProject.project(':app').tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
                  systemProperty 'robolectric.dependency.repo.url', 'https://maven-central.storage-download.googleapis.com/maven2'
                  doFirst {
                      logger.lifecycle('Robolectric dependency repository: {}', systemProperties['robolectric.dependency.repo.url'])
                  }
              }
          }
          GRADLE
            cp "$RUNNER_TEMP/daiyu-robolectric-mirror.init.gradle" workflow-checks/robolectric-mirror.init.gradle
            robolectric_init=(-I "$RUNNER_TEMP/daiyu-robolectric-mirror.init.gradle")
            domain_tasks=(:core-domain:test --tests app.daiyu.android.domain.BottomFollowMotionTest)
          fi
          ./gradlew --no-daemon --parallel --build-cache --console=plain \
            -I scripts/cooperation/checks_only.init.gradle "${robolectric_init[@]}" \
            -PdaiyuCheckGraph=workflow-checks/task-graph.json \
            "${domain_tasks[@]}" :app:compileDebugKotlin :app:testDebugUnitTest "${filters[@]}" \
            :app:compileDebugAndroidTestKotlin 2>&1 | tee workflow-checks/gradle.log
      - name: 核对定向报告及零安装包
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path.cwd()
          expected = {'AssistantWorkflowContentTest', 'ToolHeaderTextTest', 'ReportedReasoningTextTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'workflow':
              expected |= {'ReconnectPartsTest', 'WorkflowDisclosureMotionTest', 'ReasoningStreamCompositionTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] != 'environment-dots':
              expected |= {'ChatTurnMapperTest', 'ReasoningWorkflowMapperTest', 'AssistantWorkflowCompositionTest',
                           'WorkflowConnectorsTest', 'ReasoningHandoffTest', 'MarkdownAdmissionCompositionTest',
                           'WorkflowNarrationCompositionTest', 'MarkdownRevealTest', 'MarkdownRevealHapticsTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'composer-send':
              expected = {'ComposerPhaseProjectionTest', 'ForegroundComposerStateTest', 'ChatSubmissionPreviewTest',
                          'ChatProjectionTest', 'ComposerTextActionTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'markdown-table':
              expected = {'MarkdownTableGridTest', 'MarkdownTableWidthTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] in ('cold-start', 'session-switch'):
              expected = {'RestoredMarkdownTest', 'ToolPresentationCacheTest', 'ToolPresentationJsonTest', 'ToolCardPresentationTest', 'ToolRichDetailsTest', 'ToolBodyLayoutTest', 'TerminalToolTargetTest', 'MarkdownProjectionCacheTest', 'MarkdownProjectionTest',
                          'MarkdownPreparationCompositionTest', 'MarkdownRevealTest', 'ChatTurnMapperTest',
                          'ChatInitialPositionPolicyTest', 'ContextTimelineColdStartTest', 'AssistantWorkflowCompositionTest',
                          'SQLiteTextTest', 'SQLiteTextChunksTest', 'ConversationPreviewTest', 'MessageDisplayStoreTest',
                          'StreamingHistoryRefreshTest', 'ToolReceiptSourceTest', 'ToolActivityUiTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'task-scroll':
              expected = {'MarkdownRevealTest', 'MarkdownRevealInvalidationTest', 'MarkdownRevealHapticsTest',
                          'AssistantWorkflowCompositionTest', 'WorkflowNarrationCompositionTest', 'ReasoningStreamCompositionTest',
                          'MarkdownAdmissionCompositionTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'page-performance':
              expected = {'MarkdownRevealTest', 'MarkdownRevealInvalidationTest', 'MarkdownRevealHapticsTest',
                          'AssistantWorkflowCompositionTest', 'WorkflowNarrationCompositionTest', 'ReasoningStreamCompositionTest',
                          'ToolPresentationCacheTest', 'ChatTurnMapperTest', 'StreamingHistoryRefreshTest',
                          'CatalogModelSelectionTest', 'ModelUsageProjectionTest', 'TerminalTaskOutputTest', 'TerminalGridBufferTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'terminal-output':
              expected = {'ToolOutputPreviewTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'tool-receipts':
              expected = {'ToolReceiptSourceTest', 'ToolActivityUiTest', 'ChatTurnMapperTest',
                          'ReasoningWorkflowMapperTest', 'WorkProcessProgressTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'rendering':
              expected = {'NativeCompletionWebSearchTest', 'MarkdownProjectionTest', 'CompletedReasoningProjectionTest', 'MarkdownTableGridTest', 'RenderingParserRegressionTest', 'AssistantWorkflowCompositionTest', 'ReasoningWorkflowMapperTest', 'ReasoningStreamCompositionTest', 'MessageDisplayStoreTest', 'LegacySearchDisplayTest', 'RenderingMediaGeometryTest', 'ResponsesBackgroundResumeTest', 'MarkdownRevealHapticsTest', 'MarkdownTableWidthTest', 'MarkdownParserTest', 'MarkdownProjectionCacheTest', 'WorkflowNarrationCompositionTest', 'ResponsesDeltaBatchTest', 'MarkdownRevealInvalidationTest', 'ChatTurnMapperTest', 'ReportedReasoningTextTest', 'MarkdownBlockReuseTest', 'RestoredMarkdownTest', 'MarkdownRevealTest', 'MessageMediaLayoutTest', 'StreamingMarkdownParserTest', 'MarkdownPreparationCompositionTest', 'MarkdownCodePolicyTest', 'AssistantWorkflowContentTest', 'MarkdownAdmissionCompositionTest', 'ResponsesWebSearchTest', 'ReconnectPartsTest', 'ReconnectMarkdownProjectionAcceptanceTest', 'ReconnectMarkdownRestoreAcceptanceTest', 'LegacyReconnectRestoreTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'legacy-restore':
              expected = {'LegacyReconnectRestoreTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'search-history':
              expected = {'MessageImageContractTest', 'MessageSearchRequestStateTest', 'SearchRequestStateTest', 'ConversationSearchResultsTest', 'SearchHighlightTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'conversation-date':
              expected = {'ConversationDrawerGroupsTest', 'ConversationPreviewTest', 'BackupConversationMergeTest', 'MessageDisplayStoreTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'ime':
              expected = {'ChatInitialPositionPolicyTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'message-actions':
              expected = {'MessageActionRenderedRevisionTest', 'QuestionCheckpointEvidenceTest',
                          'ChatTurnMapperTest', 'AssistantWorkflowContentTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'question-card':
              expected = {'QuestionCheckpointEvidenceTest', 'QuestionToolBridgeTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'workflow-collapse':
              expected = {'WorkflowDisclosureMotionTest'}
          if os.environ['WORKFLOW_CHECK_SCOPE'] == 'workflow-node-motion':
              expected = {'WorkflowConnectorsTest', 'WorkflowNarrationCompositionTest', 'MarkdownRevealTest', 'ReasoningHandoffTest'}
          suites = [ET.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          names = {suite.attrib['name'].rsplit('.', 1)[-1] for suite in suites}
          assert names == expected, (names, expected)
          assert all(int(s.attrib['tests']) > 0 for s in suites)
          assert all(int(s.attrib.get(k, 0)) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          graph = json.loads(Path('workflow-checks/task-graph.json').read_text())
          log = Path('workflow-checks/gradle.log').read_text()
          outcomes = {}
          for task in (':app:compileDebugKotlin', ':app:testDebugUnitTest', ':app:compileDebugAndroidTestKotlin'):
              assert task in graph, task
              match = re.search(r'^> Task ' + re.escape(task) + r'(?: (UP-TO-DATE|FROM-CACHE|NO-SOURCE|SKIPPED))?\s*$', log, re.M)
              assert match and match.group(1) not in ('NO-SOURCE', 'SKIPPED'), task
              outcomes[task] = match.group(1) or 'EXECUTED'
          packages = [str(p) for p in root.rglob('*') if p.is_file() and p.suffix.lower() in ('.apk', '.aab', '.apks')]
          assert not packages, packages
          record = dict(source_sha=os.environ['EXPECTED_SHA'], workflow_sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                        attempt=int(os.environ['GITHUB_RUN_ATTEMPT']), tests=sum(int(s.attrib['tests']) for s in suites),
                        check_scope=os.environ['WORKFLOW_CHECK_SCOPE'], classes=sorted(names), contracts=json.loads(Path('workflow-checks/contracts.json').read_text()),
                        task_outcomes=outcomes, apk_built=False, instrumentation_run=False)
          if record['check_scope'] == 'task-scroll':
              domain_suites = [ET.parse(p).getroot() for p in Path('core-domain/build/test-results/test').glob('TEST-*.xml')]
              assert len(domain_suites) == 1
              assert {s.attrib['name'] for s in domain_suites} == {'app.daiyu.android.domain.BottomFollowMotionTest'}
              assert all(int(s.attrib['tests']) > 0 for s in domain_suites)
              assert all(int(s.attrib.get(k, 0)) == 0 for s in domain_suites for k in ('failures', 'errors', 'skipped'))
              assert ':core-domain:test' in graph
              domain_task = re.search(r'^> Task :core-domain:test(?: (UP-TO-DATE|FROM-CACHE|NO-SOURCE|SKIPPED))?\s*$', log, re.M)
              assert domain_task and domain_task.group(1) not in ('NO-SOURCE', 'SKIPPED')
              record['domain_checks'] = dict(tests=sum(int(s.attrib['tests']) for s in domain_suites),
                                           classes=sorted(s.attrib['name'] for s in domain_suites),
                                           task_outcome=domain_task.group(1) or 'EXECUTED')
          tools = Path('workflow-checks/contract-tools.json')
          if tools.exists():
              record['contract_tools'] = json.loads(tools.read_text())
          Path('workflow-checks/record.json').write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(record, ensure_ascii=False))
          PY
      - name: 上传检查证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 工作流程定向检查
          path: |
            workflow-checks/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/host-pty/
            core-domain/build/test-results/test/
            core-domain/build/reports/tests/test/
          if-no-files-found: error

  attachment-contracts:
    name: 界面精简定向契约
    if: github.ref == 'refs/heads/main' && (inputs.check_scope == 'attachment-contracts' || inputs.check_scope == 'permission-contracts')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CONTRACT_SCOPE: ${{ inputs.check_scope }}
    steps:
      - name: 拒绝非任务滚动范围的独立契约工具
        env:
          CONTRACT_TOOLS_SHA: ${{ inputs.contract_tools_sha }}
        run: test -z "$CONTRACT_TOOLS_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: 界面精简定向契约（不编译、不打包）
        shell: bash
        run: |
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p attachment-checks
          set -o pipefail
          python3 -B - 2>&1 <<'PY' | tee attachment-checks/contracts.log
          import json, os, unittest
          from pathlib import Path
          records = []
          patterns = ('test_permission_check_contract.py', 'test_accessibility_keepalive_contract.py') if os.environ['CONTRACT_SCOPE'] == 'permission-contracts' else (
              'test_chat_attachment_sizing_contract.py', 'test_shared_sheet_spacing_contract.py',
              'test_sheet_selection_exit_contract.py')
          for pattern in patterns:
              suite = unittest.TestLoader().discover('tests', pattern=pattern)
              assert suite.countTestCases() > 0, pattern
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              assert result.wasSuccessful() and not result.skipped, pattern
              records.append(dict(pattern=pattern, tests=result.testsRun, skipped=0))
          record = dict(source_sha=os.environ['EXPECTED_SHA'], workflow_sha=os.environ['GITHUB_SHA'],
                        run_id=os.environ['GITHUB_RUN_ID'], attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                        check_scope=os.environ['CONTRACT_SCOPE'], contracts=records,
                        apk_built=False, instrumentation_run=False, kotlin_compiled=False)
          Path('attachment-checks/record.json').write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(record, ensure_ascii=False))
          PY
      - name: 上传附件契约证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.check_scope == 'permission-contracts' && '权限界面契约检查' || '附件弹层契约检查' }}
          path: attachment-checks/
          if-no-files-found: error
