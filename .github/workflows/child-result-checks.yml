name: 代鱼子任务结果检查
run-name: 代鱼子任务结果检查 ${{ inputs.check_id }}
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 检查目标完整提交SHA
        type: string
        required: true
      check_id:
        description: 子任务结果分类定向检查标识
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: daiyu-child-result-${{ github.ref }}
  cancel-in-progress: false
jobs:
  child-results:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      SKIP_JDK_VERSION_CHECK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 核对检查源码
        run: python3 scripts/cooperation/cloud_checks.py --verify-revision-only
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: |
            21
            27
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms/android-37.2 build-tools/37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: 子任务定向源码契约
        shell: bash
        run: |
          mkdir -p child-result-checks
          set -o pipefail
          python3 -B - <<'PYTEST' 2>&1 | tee child-result-checks/contracts.log
          import json, unittest
          from pathlib import Path
          records = []
          for pattern in ('test_delegation_batch_and_send_contract.py', 'test_child_stop_hot_configuration_contract.py',
                          'test_subagent_resume_display_contract.py', 'test_subagent_collaboration_contract.py',
                          'test_sidebar_task_entry_contract.py', 'test_child_task_card_contract.py',
                          'test_chat_return_refresh_contract.py'):
              suite = unittest.TestLoader().discover('tests', pattern=pattern)
              assert suite.countTestCases() > 0, pattern
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              assert result.wasSuccessful() and not result.skipped, pattern
              records.append(dict(pattern=pattern, tests=result.testsRun, skipped=0))
          Path('child-result-checks/contracts.json').write_text(json.dumps(records, indent=2) + '\n')
          PYTEST
          python3 scripts/verify_boundaries.py
          python3 scripts/verify_project_identity.py
      - name: 子任务领域及工具边界定向单测
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --parallel --build-cache --console=plain \
            -I scripts/cooperation/checks_only.init.gradle \
            -PdaiyuCheckGraph=child-result-checks/domain-task-graph.json \
            :core-domain:test --tests 'app.daiyu.android.domain.delegation.*' \
            --tests 'app.daiyu.android.domain.runtime.RunnerReceiptBatchTest' \
            --tests 'app.daiyu.android.domain.runtime.RunnerToolBoundaryTest' \
            --tests 'app.daiyu.android.domain.usage.ChildUsagePipelineTest' \
            2>&1 | tee child-result-checks/domain-gradle.log
      - name: 准备既有离线语音依赖（不打包）
        run: ./gradlew --no-daemon :app:prepareOfflineSpeechRuntime
      - name: 子任务状态单测及生产回归声明编译（不打包）
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --parallel --build-cache --console=plain \
            -I scripts/cooperation/checks_only.init.gradle \
            -PdaiyuCheckGraph=child-result-checks/app-task-graph.json \
            :app:compileDebugKotlin :app:testDebugUnitTest \
            --tests 'app.daiyu.android.ui.screens.chat.conversation.SubAgentStatusRowsTest' \
            --tests 'app.daiyu.android.backup.LargeChildTaskBackupTest' \
            --tests 'app.daiyu.android.delegation.SubAgentDescriptorTest' \
            --tests 'app.daiyu.android.delegation.SavedSubAgentRuntimeBindingsTest' \
            --tests 'app.daiyu.android.integration.tools.RunChildModelsTest' \
            --tests 'app.daiyu.android.integration.tools.RunChildTasksTest' \
            --tests 'app.daiyu.android.integration.tools.RunChildTaskAccessTest' \
            --tests 'app.daiyu.android.integration.tools.RunOrdinaryGenerationToolsTest' \
            --tests 'app.daiyu.android.ui.screens.chat.conversation.ChildTaskCardPresentationTest' \
            --tests 'app.daiyu.android.ui.screens.chat.conversation.ToolBodyLayoutTest' \
            --tests 'app.daiyu.android.ui.screens.chat.conversation.ToolRichDetailsTest' \
            --tests 'app.daiyu.android.ui.screens.chat.conversation.ToolCardPresentationTest' \
            --tests 'app.daiyu.android.ui.screens.chat.conversation.ChildTaskPresentationTest' \
            --tests 'app.daiyu.android.ui.screens.chat.conversation.BatchDelegationPresentationTest' \
            --tests 'app.daiyu.android.ui.screens.chat.conversation.ToolCardChildControlTest' \
            :app:compileDebugAndroidTestKotlin 2>&1 | tee child-result-checks/app-gradle.log
      - name: 核对定向报告与零安装包
        run: |
          python3 - <<'VERIFY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          domain = [ET.parse(p).getroot() for p in Path('core-domain/build/test-results/test').glob('TEST-*.xml')]
          app = [ET.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          names = {s.attrib['name'].rsplit('.', 1)[-1] for s in domain}
          assert {'ChildModelBatchTest', 'ChildModelExecutionToolsTest', 'ChildTaskCommandTest',
                  'RunnerReceiptBatchTest', 'RunnerToolBoundaryTest', 'ChildUsagePipelineTest'} <= names, names
          assert {s.attrib['name'].rsplit('.', 1)[-1] for s in app} == {'SubAgentStatusRowsTest', 'LargeChildTaskBackupTest', 'SubAgentDescriptorTest',
              'SavedSubAgentRuntimeBindingsTest', 'RunChildModelsTest', 'RunChildTasksTest',
              'RunChildTaskAccessTest', 'RunOrdinaryGenerationToolsTest',
              'ChildTaskCardPresentationTest', 'ToolBodyLayoutTest', 'ToolRichDetailsTest', 'ToolCardPresentationTest', 'ChildTaskPresentationTest', 'BatchDelegationPresentationTest', 'ToolCardChildControlTest'}
          suites = domain + app
          assert suites and all(int(s.attrib['tests']) > 0 for s in suites)
          assert all(int(s.attrib.get(k, 0)) == 0 for s in suites for k in ('failures','errors','skipped'))
          assert not [p for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in ('.apk','.aab','.apks')]
          record = dict(source_sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                        attempt=int(os.environ['GITHUB_RUN_ATTEMPT']), tests=sum(int(s.attrib['tests']) for s in suites),
                        domain_classes=sorted(names), contracts=json.loads(Path('child-result-checks/contracts.json').read_text()),
                        apk_built=False, instrumentation_run=False)
          Path('child-result-checks/record.json').write_text(json.dumps(record, ensure_ascii=False, indent=2)+'\n')
          print(json.dumps(record, ensure_ascii=False))
          VERIFY
      - name: 上传检查证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 子任务结果定向检查
          path: |
            child-result-checks/
            core-domain/build/test-results/test/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
