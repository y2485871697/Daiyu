name: 代鱼通话与朗读检查
run-name: 代鱼通话与朗读检查 ${{ inputs.check_scope }} ${{ inputs.check_id }}
on:
  workflow_dispatch:
    inputs:
      check_scope:
        description: 仅运行本次受影响的通话、消息朗读或试听检查
        type: choice
        options: [duplex, speech]
        default: duplex
        required: true
      expected_sha:
        description: 检查目标完整提交SHA
        type: string
        required: true
      check_id:
        description: 本次定向检查标识
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: daiyu-duplex-call-${{ github.ref }}
  cancel-in-progress: false
jobs:
  workflow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CHECK_ID: ${{ inputs.check_id }}
      CHECK_SCOPE: ${{ inputs.check_scope }}
      SKIP_JDK_VERSION_CHECK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 核对检查源码
        run: |
          test -n "$EXPECTED_SHA"
          python3 scripts/cooperation/cloud_checks.py --verify-revision-only
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: |
            21
            27
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms/android-37.2 build-tools/37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: 受影响语音路径定向契约
        shell: bash
        run: |
          mkdir -p duplex-call-checks
          set -o pipefail
          python3 -B - 2>&1 <<'PY' | tee duplex-call-checks/contracts.log
          import json, os, unittest
          from pathlib import Path
          records = []
          patterns = ('test_chat_voice_feedback_contract.py', 'test_toast_concise_copy_contract.py', 'test_message_speech_button_contract.py', 'test_message_speech_diagnostics_contract.py') if os.environ['CHECK_SCOPE'] == 'speech' else ('test_doubao_call_sheet_contract.py', 'test_chat_voice_feedback_contract.py', 'test_call_entry_corrections_contract.py', 'test_voice_long_press_menu_contract.py')
          for pattern in patterns:
              suite = unittest.TestLoader().discover('tests', pattern=pattern)
              assert suite.countTestCases() > 0, pattern
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              assert result.wasSuccessful() and not result.skipped, pattern
              records.append(dict(pattern=pattern, tests=result.testsRun, skipped=0))
          Path('duplex-call-checks/contracts.json').write_text(json.dumps(records, indent=2) + '\n')
          PY
          python3 scripts/verify_boundaries.py
      - name: 准备既有离线语音依赖（不打包）
        run: ./gradlew --no-daemon -I scripts/cooperation/checks_only.init.gradle :app:prepareOfflineSpeechRuntime
      - name: 通话或朗读增量检查（不打包）
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PYRESET'
          import shutil
          from pathlib import Path
          shutil.rmtree('app/build/test-results/testDebugUnitTest', ignore_errors=True)
          for name in ('task-graph.json', 'record.json'):
              Path('duplex-call-checks', name).unlink(missing_ok=True)
          PYRESET
          if [[ "$CHECK_SCOPE" == speech ]]; then
            classes=(app.daiyu.android.voice.providers.DoubaoPcmStreamTest app.daiyu.android.voice.StreamingPcmPlayerTest app.daiyu.android.diagnostics.DiagnosticLogStoreTest app.daiyu.android.voice.SpeechAudioFileTest app.daiyu.android.RemoteVoiceHostPlayerAudioFocusTest app.daiyu.android.RemoteVoicePlaybackBudgetTest app.daiyu.android.VoiceHostTest app.daiyu.android.VoiceHostGateTest app.daiyu.android.voice.network.HttpVoiceNetworkTest app.daiyu.android.ActivityVoiceAccountPreviewHostTest app.daiyu.android.AccountPreviewSpeechPlayerTailTest app.daiyu.android.voice.account.PersonalVoicePreviewTest)
          else
            classes=(app.daiyu.android.DoubaoCallPresentationOwnerTest app.daiyu.android.DuplexCallSnapshotTest app.daiyu.android.voice.duplex.DuplexRouteLeaseTest app.daiyu.android.voice.duplex.DoubaoDuplexFixtureTest app.daiyu.android.voice.network.SocketVoiceNetworkTest app.daiyu.android.voice.network.WebSocketBoundsTest)
          fi
          filters=()
          for class in "${classes[@]}"; do filters+=(--tests "$class"); done
          ./gradlew --no-daemon --parallel --build-cache --console=plain \
            -I scripts/cooperation/checks_only.init.gradle \
            -PdaiyuCheckGraph=duplex-call-checks/task-graph.json \
            :app:compileDebugKotlin :app:testDebugUnitTest "${filters[@]}" \
            :app:compileDebugAndroidTestKotlin 2>&1 | tee duplex-call-checks/gradle.log
      - name: 核对定向报告及零安装包
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path.cwd()
          required = {'app.daiyu.android.DoubaoCallPresentationOwnerTest',
                      'app.daiyu.android.DuplexCallSnapshotTest',
                      'app.daiyu.android.voice.duplex.DuplexRouteLeaseTest',
                      'app.daiyu.android.voice.duplex.DoubaoDuplexFixtureTest',
                      'app.daiyu.android.voice.network.SocketVoiceNetworkTest',
                      'app.daiyu.android.voice.network.WebSocketBoundsTest'}
          if os.environ['CHECK_SCOPE'] == 'speech':
              required = {'app.daiyu.android.voice.providers.DoubaoPcmStreamTest', 'app.daiyu.android.voice.StreamingPcmPlayerTest', 'app.daiyu.android.diagnostics.DiagnosticLogStoreTest', 'app.daiyu.android.voice.SpeechAudioFileTest', 'app.daiyu.android.RemoteVoiceHostPlayerAudioFocusTest', 'app.daiyu.android.RemoteVoicePlaybackBudgetTest', 'app.daiyu.android.VoiceHostTest', 'app.daiyu.android.VoiceHostGateTest', 'app.daiyu.android.voice.network.HttpVoiceNetworkTest', 'app.daiyu.android.ActivityVoiceAccountPreviewHostTest', 'app.daiyu.android.AccountPreviewSpeechPlayerTailTest', 'app.daiyu.android.voice.account.PersonalVoicePreviewTest'}
          suites = [ET.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          names = [suite.attrib['name'] for suite in suites]
          assert required == set(names) and len(names) == len(set(names)), (names, required)
          cases = set()
          for suite in suites:
              assert suite.tag == 'testsuite' and int(suite.attrib['tests']) > 0
              assert all(int(suite.attrib.get(k, 0)) == 0 for k in ('failures', 'errors', 'skipped'))
              assert not any(suite.findall('.//' + k) for k in ('failure', 'error', 'skipped'))
              assert len(suite.findall('testcase')) == int(suite.attrib['tests'])
              for case in suite.findall('testcase'):
                  key = (case.attrib['classname'], case.attrib['name'])
                  assert key[0] == suite.attrib['name'] and key not in cases, key
                  cases.add(key)
          graph = json.loads(Path('duplex-call-checks/task-graph.json').read_text())
          log = Path('duplex-call-checks/gradle.log').read_text()
          for task in (':app:compileDebugKotlin', ':app:testDebugUnitTest', ':app:compileDebugAndroidTestKotlin'):
              assert task in graph, task
              match = re.search(r'^> Task ' + re.escape(task) + r'(?: (UP-TO-DATE|FROM-CACHE|NO-SOURCE|SKIPPED))?\s*$', log, re.M)
              assert match and match.group(1) not in ('NO-SOURCE', 'SKIPPED'), task
          packages = [str(p) for p in root.rglob('*') if p.is_file() and p.suffix.lower() in ('.apk', '.aab', '.apks')]
          assert not packages, packages
          record = dict(check_id=os.environ['CHECK_ID'], source_sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                        attempt=int(os.environ['GITHUB_RUN_ATTEMPT']), tests=sum(int(s.attrib['tests']) for s in suites),
                        scope=os.environ['CHECK_SCOPE'] + '-targeted', classes=sorted(names), contracts=json.loads(Path('duplex-call-checks/contracts.json').read_text()),
                        compile_outcomes='production-and-androidtest-verified-from-task-log',
                        apk_built=False, instrumentation_run=False)
          Path('duplex-call-checks/record.json').write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(record, ensure_ascii=False))
          PY
      - name: 上传检查证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 实时通话面板定向检查
          path: |
            duplex-call-checks/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
