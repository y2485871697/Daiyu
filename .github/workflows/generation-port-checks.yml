name: 代鱼图片视频生成移植检查
run-name: 代鱼生成移植检查 ${{ inputs.check_id }}
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 检查目标完整提交SHA
        type: string
        required: true
      check_id:
        description: 定向检查标识
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: daiyu-generation-port-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      SKIP_JDK_VERSION_CHECK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 核对准确源码
        run: python3 scripts/cooperation/cloud_checks.py --verify-revision-only
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: |
            21
            27
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms/android-37.2 build-tools/37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: 准备既有离线依赖（不打包）
        run: ./gradlew --no-daemon :app:prepareOfflineSpeechRuntime
      - name: 生成协议与生产接线定向单测（无真实付费请求）
        shell: bash
        run: |
          mkdir -p generation-port-checks
          set -o pipefail
          ./gradlew --no-daemon --parallel --build-cache --console=plain \
            -I scripts/cooperation/checks_only.init.gradle \
            -PdaiyuCheckGraph=generation-port-checks/task-graph.json \
            :app:compileDebugKotlin :app:testDebugUnitTest \
            --tests 'app.daiyu.android.model.generation.*' \
            --tests '*RunGenerationToolsTest' --tests '*RunOrdinaryGenerationToolsTest' \
            --tests '*ControllerGenerationPreparationTest' --tests '*GenerationInputHostTest' \
            --tests '*SavedCatalogSubAgentModelSourceTest' --tests '*SavedSubAgentRuntimeBindingsTest' \
            --tests '*GenerationAttemptCodecTest' --tests '*BackupGenerationCodecTest' 2>&1 | tee generation-port-checks/gradle.log
      - name: 核对测试终态和零安装包
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          assert suites and any('GenerationPortIntegrationTest' in s.attrib['name'] for s in suites)
          assert all(int(s.attrib['tests']) > 0 and int(s.attrib.get('failures', 0)) == 0 and int(s.attrib.get('errors', 0)) == 0 for s in suites)
          assert not list(Path('app/build/outputs').rglob('*.apk'))
          PY
      - name: 上传定向检查证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 代鱼生成移植检查-${{ inputs.check_id }}
          path: |
            generation-port-checks/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
