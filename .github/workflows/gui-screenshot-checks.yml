name: 代鱼截图通道检查
run-name: 代鱼截图通道检查 ${{ inputs.check_id }}
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 检查目标完整提交SHA
        type: string
        required: true
      check_id:
        description: 本次定向检查标识
        type: string
        required: true
      check_scope:
        description: 截图通道、独立截图路由或操作临时截图清理
        type: choice
        options: [screenshot, direct-read, temporary-cleanup, gestures]
        default: screenshot
permissions:
  contents: read
concurrency:
  group: daiyu-gui-screenshot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  workflow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GUI_CHECK_SCOPE: ${{ inputs.check_scope }}
      SKIP_JDK_VERSION_CHECK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: 核对检查源码
        run: |
          test -n "$EXPECTED_SHA"
          python3 - <<'PYREV'
          import os, re, subprocess
          expected = os.environ['EXPECTED_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', expected), expected
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == expected, (actual, expected)
          print('CHECK_SHA=' + actual)
          PYREV
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: |
            21
            27
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms/android-37.2 build-tools/37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: 检查源码边界
        if: inputs.check_scope == 'screenshot'
        run: |
          set -o pipefail
          mkdir -p gui-screenshot-checks
          python3 scripts/verify_boundaries.py 2>&1 | tee gui-screenshot-checks/boundaries.log
          PYTHONPATH=tests python3 -B -m unittest -v \
            test_project_identity_contract test_record_tool_tests_scope test_acceptance_tool_receipt test_screen_history_smoke_scope test_rootless_content_smoke_scope test_streaming_freeze_contract test_runtime_checkpoint_reuse_contract test_runtime_commit_hotpath_contract test_checkpoint_encoding_hotpath_contract \
            test_smoke_boot.SourceTests.test_compile_source_requires_same_sha_and_explicit_targeted_scope \
            2>&1 | tee gui-screenshot-checks/screen-history-scope.log
          PYTHONPATH=tests python3 -B -m unittest -v \
            test_ordinary_tool_wiring_contract.OrdinaryToolWiringContract.test_normal_run_registers_real_scopes_and_capabilities \
            test_ordinary_tool_wiring_contract.OrdinaryToolWiringContract.test_gui_target_is_validated_before_session_mutation \
            2>&1 | tee gui-screenshot-checks/ordinary-gui-contracts.log
          python3 -B -m unittest discover -s tests -p 'test_gui_audit_recovery_contract.py' -v \
            2>&1 | tee gui-screenshot-checks/audit-recovery-contracts.log
          python3 -B -m unittest discover -s tests -p 'test_gui_app_launch_contract.py' -v \
            2>&1 | tee gui-screenshot-checks/app-launch-contracts.log
      - name: 准备既有离线语音依赖（不打包）
        run: ./gradlew --no-daemon -I scripts/cooperation/checks_only.init.gradle :app:prepareOfflineSpeechRuntime
      - name: 截图通道定向单测及Compose源码编译（不打包）
        if: inputs.check_scope == 'screenshot'
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PYRESET'
          import shutil
          from pathlib import Path
          shutil.rmtree('app/build/test-results/testDebugUnitTest', ignore_errors=True)
          shutil.rmtree('core-domain/build/test-results/test', ignore_errors=True)
          for name in ('task-graph.json', 'record.json'):
              Path('gui-screenshot-checks', name).unlink(missing_ok=True)
          PYRESET
          ./gradlew --no-daemon --parallel --build-cache --console=plain \
            -I scripts/cooperation/checks_only.init.gradle \
            -PdaiyuCheckGraph=gui-screenshot-checks/task-graph.json \
            :app:compileDebugKotlin :app:testDebugUnitTest \
            --tests 'app.daiyu.android.diagnostics.DiagnosticLogStoreTest' \
            --tests 'app.daiyu.android.diagnostics.RuntimeDiagnosticsTest' \
            --tests 'app.daiyu.android.storage.SQLiteVerifiedTextReuseTest' \
            --tests 'app.daiyu.android.storage.SQLiteTextTest' \
            --tests 'app.daiyu.android.storage.SQLiteTextChunksTest' \
            --tests 'app.daiyu.android.storage.ScreenHistoryReceiptReuseTest' \
            --tests 'app.daiyu.android.storage.CommitMessageDecodeReuseTest' \
            --tests 'app.daiyu.android.storage.ConversationMessageDecodeReuseSQLiteTest' \
            --tests 'app.daiyu.android.platform.AppLabelCacheTest' \
            --tests 'app.daiyu.android.gui.GuiAppLaunchTest' \
            --tests 'app.daiyu.android.model.ScreenToolImageInputTest' \
            --tests 'app.daiyu.android.model.StreamEventBufferTest' \
            --tests 'app.daiyu.android.model.ResponsesDeltaBatchTest' \
            --tests 'app.daiyu.android.model.AllProtocolRequestRetryTest' \
            --tests 'app.daiyu.android.media.ScreenToolImageStoreTest' \
            --tests 'app.daiyu.android.model.RequestInputEstimateTest' \
            --tests 'app.daiyu.android.context.ProductionRunContextCapacityTest' \
            --tests 'app.daiyu.android.context.ModelContextSummarizerContractTest' \
            --tests 'app.daiyu.android.context.ProviderSummaryModelTest' \
            --tests 'app.daiyu.android.context.ContextManagementControllerAdapterTest' \
            --tests 'app.daiyu.android.context.ContextTimelineColdStartTest' \
            --tests 'app.daiyu.android.backup.StrictHistoryContractTest' \
            --tests 'app.daiyu.android.backup.RunCheckpointCodecTest' \
            --tests 'app.daiyu.android.storage.RuntimeCheckpointReuseTest' \
            --tests 'app.daiyu.android.storage.CheckpointJsonWriterTest' \
            --tests 'app.daiyu.android.storage.AndroidCheckpointJsonWriterTest' \
            --tests 'app.daiyu.android.context.ArchiveCheckpointArrayTest' \
            --tests 'app.daiyu.android.context.Utf8PayloadTest' \
            --tests 'app.daiyu.android.ui.ToolReceiptSourceTest' \
            --tests 'app.daiyu.android.storage.RunCheckpointQuotedStringsTest' \
            --tests 'app.daiyu.android.storage.AndroidRunCheckpointQuotedStringsTest' \
            --tests 'app.daiyu.android.model.ResponsesReasoningIdentityTest' \
            --tests 'app.daiyu.android.model.ResponsesReasoningProgressTest' \
            --tests 'app.daiyu.android.model.ResponsesBackgroundResumeTest' \
            --tests 'app.daiyu.android.model.ResponsesBoundaryRegressionTest' \
            --tests 'app.daiyu.android.model.ResponsesProtocolCompatibilityTest' \
            --tests 'app.daiyu.android.ui.screens.chat.conversation.ChatTurnMapperTest' \
            --tests 'app.daiyu.android.ui.screens.chat.conversation.ReasoningWorkflowMapperTest' \
            --tests 'app.daiyu.android.ui.screens.chat.conversation.CompletedReasoningProjectionTest' \
            --tests 'app.daiyu.android.integration.tools.OrdinaryWriteRepeatTest' \
            --tests 'app.daiyu.android.integration.tools.PlatformCatalogTest' \
            --tests 'app.daiyu.android.platform.PlatformProductionSettingsTest' \
            --tests 'app.daiyu.android.ui.screens.chat.conversation.ToolCardPresentationTest' \
            --tests 'app.daiyu.android.ui.screens.chat.conversation.ToolPresentationCacheTest' \
            --tests 'app.daiyu.android.ui.screens.chat.conversation.ToolRichDetailsTest' \
            --tests 'app.daiyu.android.gui.GuiCaptureDisposalTest' \
            --tests 'app.daiyu.android.gui.GuiCaptureRequestTest' \
            --tests 'app.daiyu.android.gui.GuiLeaseGateTest' \
            --tests 'app.daiyu.android.gui.GuiProductionConfirmationTest' \
            --tests 'app.daiyu.android.gui.GuiProductionEntryContractTest' \
            --tests 'app.daiyu.android.gui.GuiRuntimeScreenshotTest' \
            --tests 'app.daiyu.android.gui.GuiVisualWindowParserTest' \
            --tests 'app.daiyu.android.gui.GuiScreenToolFactoryTest' \
            --tests 'app.daiyu.android.ui.ToolScreenshotReceiptUnitTest' \
            :core-domain:test --tests 'app.daiyu.android.domain.tools.ToolDispatcherTest' \
            --tests 'app.daiyu.android.domain.tools.ToolAdvertisementTest' \
            --tests 'app.daiyu.android.domain.runtime.RunnerReceiptBatchTest' \
            --tests 'app.daiyu.android.domain.runtime.RunnerContextRuntimeTest' \
            :app:compileDebugAndroidTestKotlin 2>&1 | tee gui-screenshot-checks/gradle.log
      - name: 独立截图路由及资源生命周期定向检查（不打包）
        if: inputs.check_scope != 'screenshot'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p gui-screenshot-checks
          python3 - <<'PYRESET'
          import shutil
          from pathlib import Path
          for folder in ('app/build/test-results/testDebugUnitTest', 'core-domain/build/test-results/test'):
              shutil.rmtree(folder, ignore_errors=True)
          for name in ('task-graph.json', 'record.json'):
              Path('gui-screenshot-checks', name).unlink(missing_ok=True)
          PYRESET
          python3 scripts/verify_boundaries.py 2>&1 | tee gui-screenshot-checks/boundaries.log
          PYTHONPATH=tests python3 -B -m unittest -v \
            test_project_identity_contract test_gui_direct_screenshot_contract test_gui_audit_recovery_contract \
            test_ordinary_tool_wiring_contract.OrdinaryToolWiringContract.test_gui_target_is_validated_before_session_mutation \
            test_rootless_content_smoke_scope test_gui_temporary_screenshot_cleanup_contract test_screen_cleanup_smoke_scope \
            2>&1 | tee gui-screenshot-checks/direct-read-contracts.log
          extra_tests=()
          if [[ "$GUI_CHECK_SCOPE" == temporary-cleanup ]]; then
            extra_tests+=(--tests app.daiyu.android.media.ScreenToolImageStoreTest
              --tests app.daiyu.android.model.ScreenToolImageInputTest
              --tests app.daiyu.android.ui.ToolScreenshotReceiptUnitTest
              --tests app.daiyu.android.ToolScreenshotPreviewCacheTest
              --tests app.daiyu.android.ToolScreenshotMediaPreviewTest)
          fi
          ./gradlew --no-daemon --parallel --build-cache --console=plain \
            -I scripts/cooperation/checks_only.init.gradle \
            -PdaiyuCheckGraph=gui-screenshot-checks/task-graph.json \
            :app:compileDebugKotlin :app:testDebugUnitTest "${extra_tests[@]}" \
            --tests 'app.daiyu.android.gui.GuiRuntimeScreenshotTest' \
            --tests 'app.daiyu.android.gui.GuiAppLaunchTest' \
            --tests 'app.daiyu.android.gui.GuiScreenToolFactoryTest' \
            --tests 'app.daiyu.android.gui.GuiLeaseGateTest' \
            --tests 'app.daiyu.android.gui.GuiCaptureRequestTest' \
            --tests 'app.daiyu.android.gui.GuiCaptureDisposalTest' \
            :app:compileDebugAndroidTestKotlin 2>&1 | tee gui-screenshot-checks/gradle.log
      - name: 核对定向报告及零安装包
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path.cwd()
          expected = {'app.daiyu.android.model.StreamEventBufferTest', 'app.daiyu.android.model.ResponsesDeltaBatchTest', 'app.daiyu.android.model.AllProtocolRequestRetryTest', 'app.daiyu.android.media.ScreenToolImageStoreTest', 'app.daiyu.android.storage.SQLiteVerifiedTextReuseTest', 'app.daiyu.android.storage.SQLiteTextTest', 'app.daiyu.android.storage.SQLiteTextChunksTest', 'app.daiyu.android.storage.ScreenHistoryReceiptReuseTest', 'app.daiyu.android.storage.CommitMessageDecodeReuseTest', 'app.daiyu.android.storage.ConversationMessageDecodeReuseSQLiteTest', 'app.daiyu.android.platform.AppLabelCacheTest', 'app.daiyu.android.context.ModelContextSummarizerContractTest', 'app.daiyu.android.context.ProviderSummaryModelTest', 'app.daiyu.android.context.ContextManagementControllerAdapterTest', 'app.daiyu.android.context.ContextTimelineColdStartTest', 'app.daiyu.android.diagnostics.DiagnosticLogStoreTest', 'app.daiyu.android.diagnostics.RuntimeDiagnosticsTest', 'app.daiyu.android.storage.CheckpointJsonWriterTest', 'app.daiyu.android.storage.AndroidCheckpointJsonWriterTest', 'app.daiyu.android.model.RequestInputEstimateTest', 'app.daiyu.android.context.ProductionRunContextCapacityTest', 'app.daiyu.android.domain.runtime.RunnerContextRuntimeTest', 'app.daiyu.android.context.Utf8PayloadTest', 'app.daiyu.android.ui.ToolReceiptSourceTest', 'app.daiyu.android.storage.RunCheckpointQuotedStringsTest', 'app.daiyu.android.storage.AndroidRunCheckpointQuotedStringsTest', 'app.daiyu.android.ui.screens.chat.conversation.ToolPresentationCacheTest', 'app.daiyu.android.storage.RuntimeCheckpointReuseTest', 'app.daiyu.android.backup.StrictHistoryContractTest', 'app.daiyu.android.backup.RunCheckpointCodecTest', 'app.daiyu.android.context.ArchiveCheckpointArrayTest', 'app.daiyu.android.model.ScreenToolImageInputTest', 'app.daiyu.android.platform.PlatformProductionSettingsTest', 'app.daiyu.android.ui.screens.chat.conversation.ToolCardPresentationTest', 'app.daiyu.android.domain.runtime.RunnerReceiptBatchTest', 'app.daiyu.android.model.ResponsesReasoningIdentityTest', 'app.daiyu.android.model.ResponsesReasoningProgressTest', 'app.daiyu.android.model.ResponsesBackgroundResumeTest', 'app.daiyu.android.model.ResponsesBoundaryRegressionTest', 'app.daiyu.android.model.ResponsesProtocolCompatibilityTest', 'app.daiyu.android.ui.screens.chat.conversation.ChatTurnMapperTest', 'app.daiyu.android.ui.screens.chat.conversation.ReasoningWorkflowMapperTest', 'app.daiyu.android.ui.screens.chat.conversation.CompletedReasoningProjectionTest', 'app.daiyu.android.domain.tools.ToolAdvertisementTest', 'app.daiyu.android.integration.tools.PlatformCatalogTest', 'app.daiyu.android.ui.screens.chat.conversation.ToolRichDetailsTest', 'app.daiyu.android.domain.tools.ToolDispatcherTest', 'app.daiyu.android.integration.tools.OrdinaryWriteRepeatTest', 'app.daiyu.android.gui.GuiAppLaunchTest', 'app.daiyu.android.gui.GuiCaptureRequestTest', 'app.daiyu.android.gui.GuiLeaseGateTest', 'app.daiyu.android.gui.GuiProductionConfirmationTest', 'app.daiyu.android.gui.GuiRuntimeScreenshotTest', 'app.daiyu.android.gui.GuiVisualWindowParserTest', 'app.daiyu.android.ui.ToolScreenshotReceiptUnitTest', 'app.daiyu.android.gui.GuiProductionEntryContractTest', 'app.daiyu.android.gui.GuiCaptureDisposalTest', 'app.daiyu.android.gui.GuiScreenToolFactoryTest'}
          if os.environ.get('GUI_CHECK_SCOPE') in ('direct-read', 'temporary-cleanup', 'gestures'):
              expected = {'app.daiyu.android.gui.' + name for name in ('GuiRuntimeScreenshotTest', 'GuiAppLaunchTest',
                  'GuiScreenToolFactoryTest', 'GuiLeaseGateTest', 'GuiCaptureRequestTest', 'GuiCaptureDisposalTest')}
          if os.environ.get('GUI_CHECK_SCOPE') == 'temporary-cleanup':
              expected.update({'app.daiyu.android.media.ScreenToolImageStoreTest', 'app.daiyu.android.model.ScreenToolImageInputTest', 'app.daiyu.android.ui.ToolScreenshotReceiptUnitTest', 'app.daiyu.android.ToolScreenshotPreviewCacheTest', 'app.daiyu.android.ToolScreenshotMediaPreviewTest'})
          suites = [ET.parse(p).getroot() for folder in ('app/build/test-results/testDebugUnitTest', 'core-domain/build/test-results/test') for p in Path(folder).glob('TEST-*.xml')]
          names = [suite.attrib['name'] for suite in suites]
          assert set(names) == expected and len(names) == len(expected), (names, expected)
          assert all(int(s.attrib['tests']) > 0 for s in suites)
          assert all(int(s.attrib.get(k, 0)) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          graph = json.loads(Path('gui-screenshot-checks/task-graph.json').read_text())
          log = Path('gui-screenshot-checks/gradle.log').read_text()
          for task in (':app:compileDebugKotlin', ':app:compileDebugAndroidTestKotlin'):
              assert task in graph, task
              match = re.search(r'^> Task ' + re.escape(task) + r'(?: (UP-TO-DATE|FROM-CACHE|NO-SOURCE|SKIPPED))?\s*$', log, re.M)
              assert match and match.group(1) not in ('NO-SOURCE', 'SKIPPED'), task
          packages = [str(p) for p in root.rglob('*') if p.is_file() and p.suffix.lower() in ('.apk', '.aab', '.apks')]
          assert not packages, packages
          record = dict(source_sha=os.environ['EXPECTED_SHA'], workflow_sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                        attempt=int(os.environ['GITHUB_RUN_ATTEMPT']), tests=sum(int(s.attrib['tests']) for s in suites),
                        classes=sorted(names), scope=os.environ.get('GUI_CHECK_SCOPE', 'screenshot'),
                        apk_built=False, instrumentation_run=False)
          Path('gui-screenshot-checks/record.json').write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(record, ensure_ascii=False))
          PY
      - name: 上传检查证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 截图通道定向检查
          path: |
            gui-screenshot-checks/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            core-domain/build/test-results/test/
            app/build/reports/host-pty/
          if-no-files-found: error
