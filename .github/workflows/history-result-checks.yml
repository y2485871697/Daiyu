name: 代鱼历史工具结果检查
run-name: 代鱼历史工具结果检查 ${{ inputs.check_id }}
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 检查目标完整提交SHA
        type: string
        required: true
      check_id:
        description: 历史未知工具结果定向检查标识
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: daiyu-history-result-${{ github.ref }}
  cancel-in-progress: false
jobs:
  history-results:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      SKIP_JDK_VERSION_CHECK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 核对检查源码
        run: python3 scripts/cooperation/cloud_checks.py --verify-revision-only
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: |
            21
            27
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms/android-37.2 build-tools/37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: 消息操作定向源码契约
        shell: bash
        run: |
          mkdir -p history-result-checks
          set -o pipefail
          python3 -B - <<'PYTEST' 2>&1 | tee history-result-checks/contracts.log
          import json, unittest
          from pathlib import Path
          records = []
          for pattern in ('test_message_confirmation_contract.py', 'test_message_action_snapshot_admission_contract.py',
                          'test_message_composer_edit_contract.py', 'test_context_usage_wiring_contract.py'):
              suite = unittest.TestLoader().discover('tests', pattern=pattern)
              assert suite.countTestCases() > 0, pattern
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              assert result.wasSuccessful() and not result.skipped, pattern
              records.append(dict(pattern=pattern, tests=result.testsRun, skipped=0))
          Path('history-result-checks/contracts.json').write_text(json.dumps(records, indent=2) + '\n')
          PYTEST
          python3 scripts/verify_boundaries.py
      - name: 未知结果与历史领域定向单测
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --parallel --build-cache --console=plain \
            -I scripts/cooperation/checks_only.init.gradle \
            -PdaiyuCheckGraph=history-result-checks/domain-task-graph.json \
            :core-domain:test --tests 'app.daiyu.android.domain.ModelHistoryTest' \
            --tests 'app.daiyu.android.domain.MessageHistoryTest' \
            --tests 'app.daiyu.android.domain.RunnerHistorySegmentsTest' \
            --tests 'app.daiyu.android.domain.context.ContextHistoryPolicyTest' \
            --tests 'app.daiyu.android.domain.runtime.RunnerContextRuntimeTest' \
            --tests 'app.daiyu.android.domain.ChatRunnerBatchTransactionTest' \
            --tests 'app.daiyu.android.domain.ChatRunnerRequestRetryTest' \
            --tests 'app.daiyu.android.domain.runtime.RunnerReceiptBatchTest' \
            --tests 'app.daiyu.android.domain.runtime.RunnerToolBoundaryTest' \
            --tests 'app.daiyu.android.domain.tools.ToolDispatcherTest' \
            2>&1 | tee history-result-checks/domain-gradle.log
      - name: 准备既有离线语音依赖（不打包）
        run: ./gradlew --no-daemon -I scripts/cooperation/checks_only.init.gradle :app:prepareOfflineSpeechRuntime
      - name: 历史重新生成SQLite及协议单测与声明编译（不打包）
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --parallel --build-cache --console=plain \
            -I scripts/cooperation/checks_only.init.gradle \
            -PdaiyuCheckGraph=history-result-checks/app-task-graph.json \
            :app:compileDebugKotlin :app:testDebugUnitTest \
            --tests 'app.daiyu.android.MessageHistoryRegenerationTest' \
            --tests 'app.daiyu.android.EditingImageSelectionStoreTest' \
            --tests 'app.daiyu.android.ControllerVideoSendingTest' \
            --tests 'app.daiyu.android.ControllerVideoModelSessionGuardTest' \
            --tests 'app.daiyu.android.model.ImageModelInputTest' \
            --tests 'app.daiyu.android.storage.MessageHistoryCutTest' \
            --tests 'app.daiyu.android.model.MessagesHistoryContractTest' \
            --tests 'app.daiyu.android.model.ProviderRequestWireTest' \
            --tests 'app.daiyu.android.model.RequestInputEstimateTest' \
            :app:compileDebugAndroidTestKotlin 2>&1 | tee history-result-checks/app-gradle.log
      - name: 核对定向报告与零安装包
        run: |
          python3 - <<'VERIFY'
          import json, os, re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          domain = [ET.parse(p).getroot() for p in Path('core-domain/build/test-results/test').glob('TEST-*.xml')]
          app = [ET.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          names = {s.attrib['name'].rsplit('.', 1)[-1] for s in domain}
          assert {'ModelHistoryTest', 'MessageHistoryTest', 'RunnerHistorySegmentsTest', 'ChatRunnerBatchTransactionTest',
                  'ChatRunnerRequestRetryTest', 'RunnerReceiptBatchTest', 'RunnerToolBoundaryTest', 'ToolDispatcherTest',
                  'ContextHistoryPolicyTest', 'RunnerContextRuntimeTest'} == names, names
          assert {s.attrib['name'].rsplit('.', 1)[-1] for s in app} == {'MessageHistoryRegenerationTest', 'EditingImageSelectionStoreTest', 'MessageHistoryCutTest',
                  'MessagesHistoryContractTest', 'ProviderRequestWireTest', 'RequestInputEstimateTest',
                  'ControllerVideoSendingTest', 'ControllerVideoModelSessionGuardTest', 'ImageModelInputTest'}
          suites = domain + app
          assert suites and all(int(s.attrib['tests']) > 0 for s in suites)
          assert all(int(s.attrib.get(k, 0)) == 0 for s in suites for k in ('failures','errors','skipped'))
          outcomes = {}
          for scope, tasks in (('domain', (':core-domain:test',)),
                               ('app', (':app:compileDebugKotlin', ':app:testDebugUnitTest', ':app:compileDebugAndroidTestKotlin'))):
              graph = json.loads(Path(f'history-result-checks/{scope}-task-graph.json').read_text())
              log = Path(f'history-result-checks/{scope}-gradle.log').read_text()
              for task in tasks:
                  assert task in graph, task
                  match = re.search(r'^> Task ' + re.escape(task) + r'(?: (UP-TO-DATE|FROM-CACHE|NO-SOURCE|SKIPPED))?\s*$', log, re.M)
                  assert match and match.group(1) not in ('NO-SOURCE', 'SKIPPED'), task
                  outcomes[task] = match.group(1) or 'EXECUTED'
          assert not [p for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in ('.apk','.aab','.apks')]
          record = dict(source_sha=os.environ['EXPECTED_SHA'], workflow_sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                        attempt=int(os.environ['GITHUB_RUN_ATTEMPT']), tests=sum(int(s.attrib['tests']) for s in suites),
                        domain_classes=sorted(names), app_classes=sorted(s.attrib['name'] for s in app),
                        domain_tests=sum(int(s.attrib['tests']) for s in domain), app_tests=sum(int(s.attrib['tests']) for s in app),
                        contracts=json.loads(Path('history-result-checks/contracts.json').read_text()), task_outcomes=outcomes,
                        apk_built=False, instrumentation_run=False)
          Path('history-result-checks/record.json').write_text(json.dumps(record, ensure_ascii=False, indent=2)+'\n')
          print(json.dumps(record, ensure_ascii=False))
          VERIFY
      - name: 上传检查证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 历史工具结果定向检查
          path: |
            history-result-checks/
            core-domain/build/test-results/test/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
