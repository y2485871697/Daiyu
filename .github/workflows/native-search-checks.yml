name: 代鱼原生搜索协议检查
run-name: 原生搜索协议检查 ${{ inputs.check_id }}
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 检查目标完整提交SHA
        type: string
        required: true
      check_id:
        description: 检查标识
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: daiyu-native-search-${{ github.ref }}
  cancel-in-progress: false
jobs:
  protocol:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CHECK_ID: ${{ inputs.check_id }}
      SKIP_JDK_VERSION_CHECK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: 核对准确源码
        run: |
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: |
            21
            27
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms/android-37.2 build-tools/37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: 原生搜索与浏览器排队停止定向验证
        shell: bash
        run: |
          mkdir -p native-search-checks
          set -o pipefail
          python3 -B -m unittest discover -s tests -p test_rikkahub_protocol_port_contract.py -v 2>&1 | tee native-search-checks/contracts.log
          ./gradlew --no-daemon --parallel --build-cache --console=plain \
            -I scripts/cooperation/checks_only.init.gradle \
            -PdaiyuCheckGraph=native-search-checks/task-graph.json \
            :app:prepareOfflineSpeechRuntime :app:compileDebugKotlin :app:testDebugUnitTest \
            --tests 'app.daiyu.android.model.NativeSearchAdaptersTest' \
            --tests 'app.daiyu.android.model.MessagesWebSearchTest' \
            --tests 'app.daiyu.android.model.NativeCompletionWebSearchTest' \
            --tests 'app.daiyu.android.model.ResponsesWebSearchTest' \
            --tests 'app.daiyu.android.model.MessagesFactoryContractTest' \
            --tests 'app.daiyu.android.model.MessagesHistoryContractTest' \
            --tests 'app.daiyu.android.model.MessagesProtocolCompatibilityTest' \
            --tests 'app.daiyu.android.model.NativeProtocolCompatibilityTest' \
            --tests 'app.daiyu.android.model.ResponsesProtocolCompatibilityTest' \
            --tests 'app.daiyu.android.model.AllProtocolRequestRetryTest' \
            --tests 'app.daiyu.android.model.ProviderRequestWireTest' \
            --tests 'app.daiyu.android.model.ProviderFailureBoundaryTest' \
            --tests 'app.daiyu.android.model.ProviderHeadersTest' \
            --tests 'app.daiyu.android.model.RikkaHubReasoningTest' \
            --tests 'app.daiyu.android.browser.BrowserQueuedExecutionPortTest' \
            --tests 'app.daiyu.android.browser.BrowserToolSessionTest' \
            --tests 'app.daiyu.android.browser.openminis.LeaseBrowserHostTest' \
            :app:compileDebugAndroidTestKotlin 2>&1 | tee native-search-checks/gradle.log
      - name: 核验精确测试与零安装包
        run: |
          python3 - <<'PY'
          import json, os, re, xml.etree.ElementTree as ET
          from pathlib import Path
          expected = ['AllProtocolRequestRetryTest', 'MessagesFactoryContractTest', 'MessagesHistoryContractTest', 'MessagesProtocolCompatibilityTest', 'MessagesWebSearchTest', 'NativeCompletionWebSearchTest', 'NativeProtocolCompatibilityTest', 'NativeSearchAdaptersTest', 'ProviderFailureBoundaryTest', 'ProviderHeadersTest', 'ProviderRequestWireTest', 'ResponsesProtocolCompatibilityTest', 'ResponsesWebSearchTest', 'RikkaHubReasoningTest', 'BrowserQueuedExecutionPortTest', 'BrowserToolSessionTest', 'LeaseBrowserHostTest']
          suites = [ET.parse(path).getroot() for path in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          names = {suite.attrib['name'].rsplit('.', 1)[-1] for suite in suites}
          assert set(expected) <= names, set(expected) - names
          assert all(int(suite.attrib['tests']) > 0 for suite in suites)
          assert all(int(suite.attrib.get(key, 0)) == 0 for suite in suites for key in ('failures', 'errors', 'skipped'))
          graph = json.loads(Path('native-search-checks/task-graph.json').read_text())
          log = Path('native-search-checks/gradle.log').read_text()
          for task in (':app:compileDebugKotlin', ':app:testDebugUnitTest', ':app:compileDebugAndroidTestKotlin'):
              assert task in graph
              match = re.search(r'^> Task ' + re.escape(task) + r'(?: (UP-TO-DATE|FROM-CACHE|NO-SOURCE|SKIPPED))?\s*$', log, re.M)
              assert match and match.group(1) not in ('NO-SOURCE', 'SKIPPED'), task
          assert not [path for path in Path('.').rglob('*') if path.is_file() and path.suffix.lower() in ('.apk', '.aab', '.apks')]
          record = dict(check_id=os.environ['CHECK_ID'], source_sha=os.environ['EXPECTED_SHA'], workflow_sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'], attempt=int(os.environ['GITHUB_RUN_ATTEMPT']), classes=sorted(names), tests=sum(int(suite.attrib['tests']) for suite in suites), apk_built=False, instrumentation_run=False)
          Path('native-search-checks/record.json').write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(record, ensure_ascii=False))
          PY
      - name: 上传检查证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 原生搜索协议检查
          path: |
            native-search-checks/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
