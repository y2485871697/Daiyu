name: 代鱼屏幕观察卡顿检查
run-name: 代鱼屏幕观察卡顿检查 ${{ inputs.check_id }}
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 检查目标完整提交SHA
        type: string
        required: true
      check_id:
        description: 本次定向检查标识
        type: string
        required: true
      check_scope:
        description: 存储、菜单、诊断采集或返回专项增量检查
        type: choice
        options: [storage, menu-scroll, ui-jank, ui-jank-recorder, page-back]
        default: storage
permissions:
  contents: read
concurrency:
  group: daiyu-screen-observation-jank-${{ github.ref }}
  cancel-in-progress: false
jobs:
  storage:
    if: github.ref == 'refs/heads/main' && inputs.check_scope != 'ui-jank-recorder'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      SKIP_JDK_VERSION_CHECK: 'true'
      SCREEN_JANK_CHECK_SCOPE: ${{ inputs.check_scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 核对检查源码
        run: |
          test -n "$EXPECTED_SHA"
          python3 scripts/cooperation/cloud_checks.py --verify-revision-only
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: |
            21
            27
          check-latest: true
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms/android-37.2 build-tools/37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: 所选热路径定向契约
        shell: bash
        run: |
          mkdir -p screen-jank-checks
          set -o pipefail
          python3 -B - 2>&1 <<'PY' | tee screen-jank-checks/contracts.log
          import json, os, sys, unittest
          from pathlib import Path
          records = []
          sys.path.insert(0, 'tests')
          patterns = ('test_chat_menu_scroll_isolation_contract.py', 'test_chat_menu_shadow_contract.py',
                      'test_chat_overflow_icon_colors_contract.py', 'test_chat_outside_tap_contract.py',
                      'test_dialog_motion_contract.DialogMotionContractTest.test_production_glass_menu_uses_original_popup_motion_and_exit_retention',
                      'test_dialog_motion_contract.DialogMotionContractTest.test_more_button_is_transparent_but_keeps_selection_semantics') if os.environ['SCREEN_JANK_CHECK_SCOPE'] == 'menu-scroll' else (
                      'test_checkpoint_encoding_hotpath_contract.py', 'test_runtime_checkpoint_reuse_contract.py',
                      'test_large_history_storage_contract.py', 'test_runtime_commit_hotpath_contract.py')
          if os.environ['SCREEN_JANK_CHECK_SCOPE'] == 'ui-jank':
              patterns = ('test_jank_diagnostics_contract.py', 'test_page_frame_logging_contract.py',
                          'test_release_package.py', 'test_compile_release_contract.py',
                          'test_chat_menu_scroll_isolation_contract.py', 'test_chat_menu_shadow_contract.py',
                          'test_page_back_gesture_contract.py', 'test_page_back_repeat_contract.py')
          if os.environ['SCREEN_JANK_CHECK_SCOPE'] == 'page-back':
              patterns = ('test_automatic_back_performance_contract.py', 'test_jank_diagnostics_contract.py',
                          'test_page_frame_logging_contract.py',
                          'test_page_back_gesture_contract.py', 'test_page_back_repeat_contract.py',
                          'test_chat_timeline_contract.py', 'test_reasoning_flow_stability_contract.py',
                          'test_diagnostic_smoke_source.py', 'test_page_back_smoke_scope.py',
                          'test_record_tool_tests_scope.py', 'test_acceptance_tool_receipt.py',
                          'test_smoke_boot.SourceTests.test_compile_source_requires_same_sha_and_explicit_targeted_scope')
          if os.environ['SCREEN_JANK_CHECK_SCOPE'] in ('menu-scroll', 'ui-jank'):
              patterns += ('test_diagnostic_smoke_source.py', 'test_smoke_boot.SourceTests.test_compile_source_requires_same_sha_and_explicit_targeted_scope')
          for pattern in patterns:
              suite = (unittest.TestLoader().discover('tests', pattern=pattern) if pattern.endswith('.py')
                       else unittest.TestLoader().loadTestsFromName(pattern))
              assert suite.countTestCases() > 0, pattern
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              assert result.wasSuccessful() and not result.skipped, pattern
              records.append(dict(pattern=pattern, tests=result.testsRun, skipped=0))
          Path('screen-jank-checks/contracts.json').write_text(json.dumps(records, indent=2) + '\n')
          PY
          python3 scripts/verify_boundaries.py
          if test "$SCREEN_JANK_CHECK_SCOPE" = ui-jank; then
            bash -n scripts/diagnostics/record-ui-jank.sh
            python3 -m py_compile scripts/verify_release_package.py
            ruby -rpsych -e 'ARGV.each { |f| Psych.parse_file(f) }' .github/workflows/build.yml .github/workflows/screen-observation-jank-checks.yml
          fi
      - name: 准备既有离线语音依赖（不打包）
        run: |
          ./gradlew --no-daemon --console=plain \
            -I scripts/cooperation/checks_only.init.gradle \
            -PdaiyuCheckGraph=screen-jank-checks/prepare-task-graph.json \
            :app:prepareOfflineSpeechRuntime
      - name: 所选热路径定向单测及源码编译（不打包）
        shell: bash
        run: |
          set -o pipefail
          classes=(
            app.daiyu.android.storage.CommitMessageDecodeReuseTest
            app.daiyu.android.storage.ScreenHistoryReceiptReuseTest
            app.daiyu.android.model.ScreenToolImageInputTest
            app.daiyu.android.storage.ConversationMessageDecodeReuseSQLiteTest
            app.daiyu.android.storage.CheckpointJsonWriterTest
            app.daiyu.android.storage.RunCheckpointQuotedStringsTest
            app.daiyu.android.storage.AndroidCheckpointJsonWriterTest
            app.daiyu.android.storage.AndroidRunCheckpointQuotedStringsTest
            app.daiyu.android.storage.RuntimeCheckpointReuseTest
            app.daiyu.android.storage.SQLiteRuntimeSnapshotTest
            app.daiyu.android.storage.SQLiteTextTest
            app.daiyu.android.storage.SQLiteTextChunksTest
            app.daiyu.android.storage.CompressionCheckpointCodecTest
            app.daiyu.android.storage.TransportCheckpointCodecTest
            app.daiyu.android.backup.RunCheckpointCodecTest
            app.daiyu.android.context.ArchiveCheckpointArrayTest
            app.daiyu.android.context.Utf8PayloadTest
          )
          if [[ "$SCREEN_JANK_CHECK_SCOPE" == menu-scroll ]]; then
            classes=(app.daiyu.android.ui.screens.chat.conversation.ChatMenuIsolationCompositionTest)
          fi
          if [[ "$SCREEN_JANK_CHECK_SCOPE" == ui-jank ]]; then
            classes=(app.daiyu.android.diagnostics.JankIncidentBufferTest app.daiyu.android.diagnostics.FramePerformanceLogTest app.daiyu.android.diagnostics.DiagnosticLogStoreTest app.daiyu.android.ui.screens.chat.conversation.ChatMenuIsolationCompositionTest)
          fi
          if [[ $SCREEN_JANK_CHECK_SCOPE == page-back ]]; then
            classes=(app.daiyu.android.diagnostics.RuntimeDiagnosticsTest app.daiyu.android.diagnostics.JankIncidentBufferTest app.daiyu.android.diagnostics.BackPerformanceRecorderTest app.daiyu.android.diagnostics.BackPerformanceRuntimeTest app.daiyu.android.diagnostics.DiagnosticLogStoreTest app.daiyu.android.diagnostics.FramePerformanceLogTest app.daiyu.android.ui.screens.chat.conversation.ReconnectPartsTest app.daiyu.android.ui.screens.chat.conversation.ReconnectIndexTest app.daiyu.android.ui.navigation.RootExitConfirmationTest app.daiyu.android.ui.navigation.PageBackMotionTest app.daiyu.android.ChatGptSpeedSelectionTest)
          fi
          filters=()
          for class in "${classes[@]}"; do
            filters+=(--tests "$class")
          done
          ./gradlew --no-daemon --parallel --build-cache --console=plain \
            -I scripts/cooperation/checks_only.init.gradle \
            -PdaiyuCheckGraph=screen-jank-checks/task-graph.json \
            :app:compileDebugKotlin :app:testDebugUnitTest "${filters[@]}" \
            :app:compileDebugAndroidTestKotlin 2>&1 | tee screen-jank-checks/gradle.log
      - name: 核对定向报告及零安装包
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {'CommitMessageDecodeReuseTest', 'ConversationMessageDecodeReuseSQLiteTest',
                      'ScreenHistoryReceiptReuseTest', 'ScreenToolImageInputTest',
                      'CheckpointJsonWriterTest', 'RunCheckpointQuotedStringsTest',
                      'AndroidCheckpointJsonWriterTest', 'AndroidRunCheckpointQuotedStringsTest', 'RuntimeCheckpointReuseTest',
                      'SQLiteRuntimeSnapshotTest', 'SQLiteTextTest', 'SQLiteTextChunksTest',
                      'CompressionCheckpointCodecTest', 'TransportCheckpointCodecTest',
                      'RunCheckpointCodecTest', 'ArchiveCheckpointArrayTest', 'Utf8PayloadTest'}
          if os.environ['SCREEN_JANK_CHECK_SCOPE'] == 'menu-scroll':
              expected = {'ChatMenuIsolationCompositionTest'}
          if os.environ['SCREEN_JANK_CHECK_SCOPE'] == 'ui-jank':
              expected = {'JankIncidentBufferTest', 'FramePerformanceLogTest', 'DiagnosticLogStoreTest', 'ChatMenuIsolationCompositionTest'}
          if os.environ['SCREEN_JANK_CHECK_SCOPE'] == 'page-back':
              expected = {'RuntimeDiagnosticsTest', 'JankIncidentBufferTest', 'BackPerformanceRecorderTest', 'BackPerformanceRuntimeTest', 'DiagnosticLogStoreTest',
                          'FramePerformanceLogTest', 'ReconnectPartsTest', 'ReconnectIndexTest',
                          'RootExitConfirmationTest', 'PageBackMotionTest', 'ChatGptSpeedSelectionTest'}
          suites = [ET.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          names = {suite.attrib['name'].rsplit('.', 1)[-1] for suite in suites}
          assert names == expected, (names, expected)
          assert all(int(s.attrib['tests']) > 0 for s in suites)
          assert all(int(s.attrib.get(k, 0)) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          graph = json.loads(Path('screen-jank-checks/task-graph.json').read_text())
          log = Path('screen-jank-checks/gradle.log').read_text()
          for task in (':app:compileDebugKotlin', ':app:compileDebugAndroidTestKotlin'):
              assert task in graph, task
              match = re.search(r'^> Task ' + re.escape(task) + r'(?: (UP-TO-DATE|FROM-CACHE|NO-SOURCE|SKIPPED))?\s*$', log, re.M)
              assert match and match.group(1) not in ('NO-SOURCE', 'SKIPPED'), task
          for graph_file in ('prepare-task-graph.json', 'task-graph.json'):
              for task in json.loads(Path('screen-jank-checks', graph_file).read_text()):
                  name = task.rsplit(':', 1)[-1]
                  assert not re.match(r'(?i)^(assemble|sign|install|uninstall|connected|managedDevice)', name), task
                  assert not re.match(r'(?i)^(package|bundle).*(apk|debug|release|androidtest)$', name), task
          packages = [str(p) for p in Path.cwd().rglob('*') if p.is_file() and p.suffix.lower() in ('.apk', '.aab', '.apks')]
          assert not packages, packages
          record = dict(source_sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                        attempt=int(os.environ['GITHUB_RUN_ATTEMPT']), tests=sum(int(s.attrib['tests']) for s in suites),
                        check_scope=os.environ['SCREEN_JANK_CHECK_SCOPE'], classes=sorted(names), contracts=json.loads(Path('screen-jank-checks/contracts.json').read_text()),
                        apk_built=False, instrumentation_run=False)
          Path('screen-jank-checks/record.json').write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(record, ensure_ascii=False))
          PY
      - name: 上传检查证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 屏幕观察卡顿定向检查
          path: |
            screen-jank-checks/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/host-pty/
          if-no-files-found: error

  recorder:
    if: github.ref == 'refs/heads/main' && inputs.check_scope == 'ui-jank-recorder'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 核对采集器增量源码
        run: |
          test -n "$EXPECTED_SHA"
          python3 scripts/cooperation/cloud_checks.py --verify-revision-only
      - name: 仅采集器契约与脚本检查（不编译）
        shell: bash
        run: |
          mkdir -p recorder-checks
          set -o pipefail
          python3 -B -m unittest discover -s tests -p test_jank_diagnostics_contract.py -v 2>&1 | tee recorder-checks/contracts.log
          python3 scripts/verify_boundaries.py 2>&1 | tee recorder-checks/boundaries.log
          bash -n scripts/diagnostics/record-ui-jank.sh
          ruby -rpsych -e 'ARGV.each { |f| Psych.parse_file(f) }' .github/workflows/screen-observation-jank-checks.yml
          git rev-parse HEAD > recorder-checks/source-sha.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          assert not any(p.is_file() and p.suffix.lower() in ('.apk', '.aab', '.apks') for p in Path.cwd().rglob('*'))
          record = dict(source_sha=Path('recorder-checks/source-sha.txt').read_text().strip(), run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], expected_sha=os.environ['EXPECTED_SHA'], package_scan_empty=True, scope='ui-jank-recorder', contracts_passed=True, apk_built=False, jvm_tests_run=False, instrumentation_run=False)
          Path('recorder-checks/record.json').write_text(json.dumps(record, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: UI卡顿采集器定向检查
          path: recorder-checks/
          if-no-files-found: error
